<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img" aria-labelledby="fw-title fw-desc">
<title id="fw-title">树状数组每个下标负责的区间范围</title>
<desc id="fw-desc">bit[i] 存储以 i 结尾、长度为 lowbit(i) 的一段区间之和。下标 4 负责 1 到 4，下标 8 负责 1 到 8，下标 6 负责 5 到 6。</desc>
<g font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">
<text x="192" y="42" fill="#334155">1</text><text x="277" y="42" fill="#334155">2</text><text x="362" y="42" fill="#334155">3</text><text x="447" y="42" fill="#334155">4</text><text x="532" y="42" fill="#334155">5</text><text x="617" y="42" fill="#334155">6</text><text x="702" y="42" fill="#334155">7</text><text x="787" y="42" fill="#334155">8</text>
<text x="140" y="74" fill="#334155" text-anchor="end">bit[1]=sum[1..1]</text>
<rect x="150" y="56" width="85" height="30" rx="5" fill="#dbeafe" stroke="#2563eb"/>
<text x="140" y="112" fill="#334155" text-anchor="end">bit[2]=sum[1..2]</text>
<rect x="150" y="94" width="170" height="30" rx="5" fill="#dbeafe" stroke="#2563eb"/>
<text x="140" y="150" fill="#334155" text-anchor="end">bit[3]=sum[3..3]</text>
<rect x="320" y="132" width="85" height="30" rx="5" fill="#dbeafe" stroke="#2563eb"/>
<text x="140" y="188" fill="#334155" text-anchor="end">bit[4]=sum[1..4]</text>
<rect x="150" y="170" width="340" height="30" rx="5" fill="#bfdbfe" stroke="#1d4ed8"/>
<text x="140" y="226" fill="#334155" text-anchor="end">bit[5]=sum[5..5]</text>
<rect x="490" y="208" width="85" height="30" rx="5" fill="#dbeafe" stroke="#2563eb"/>
<text x="140" y="264" fill="#334155" text-anchor="end">bit[6]=sum[5..6]</text>
<rect x="490" y="246" width="170" height="30" rx="5" fill="#dbeafe" stroke="#2563eb"/>
<text x="140" y="302" fill="#334155" text-anchor="end">bit[7]=sum[7..7]</text>
<rect x="660" y="284" width="85" height="30" rx="5" fill="#dbeafe" stroke="#2563eb"/>
<text x="140" y="340" fill="#334155" text-anchor="end">bit[8]=sum[1..8]</text>
<rect x="150" y="322" width="680" height="30" rx="5" fill="#bfdbfe" stroke="#1d4ed8"/>
<text x="440" y="384" font-size="13" fill="#475569">每个条的长度 = lowbit(i)，覆盖区间为 (i−lowbit(i), i]</text>
</g></svg>
