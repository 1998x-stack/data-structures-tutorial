<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" aria-labelledby="t d" role="img"><title id="t">括号匹配的六步栈状态</title><desc id="d">逐个读取 { [ ( ) ] }，栈先达到三层深度，再按相反顺序清空</desc><rect width="880" height="390" rx="14" fill="#f9fcf9"/>
<g font-family="system-ui,Arial,sans-serif"><text x="26" y="38" fill="#25464a" font-weight="750" font-size="20">后遇到的左括号，必须先被关闭</text><text x="26" y="61" fill="#607579" font-size="13">每一栏记录“处理当前字符之后”的未匹配左括号，文字从栈底向栈顶书写</text></g>
