<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" role="img" aria-labelledby="t d"><title id="t">最小堆的上浮与下沉</title><desc id="d">插入新元素后在末尾上浮直到不小于父节点；弹出堆顶后把末尾元素移到根并下沉，每次都和较小的孩子交换</desc><rect width="880" height="440" rx="14" fill="#f9fcf9"/>
<g font-family="system-ui,Arial,sans-serif"><text x="24" y="34" font-size="20" font-weight="750" fill="#234649">两个基本操作：上浮（swim）与下沉（sink）</text><text x="24" y="56" font-size="13" fill="#667a7d">橙色格是本步被移动的元素；数组下标从 0 起，用图 1 的父子公式定位</text></g>
<text x="24" y="98" font-size="14" font-weight="750" fill="#137976" font-family="system-ui,Arial,sans-serif">① 初始最小堆</text>
<g font-family="system-ui,Arial,sans-serif"><rect x="250" y="76" width="40" height="34" rx="6" fill="#e3f2ed" stroke="#5d9e93"/><text x="270" y="99" text-anchor="middle" font-size="17" font-weight="800" fill="#2e6462">1</text><rect x="294" y="76" width="40" height="34" rx="6" fill="#e3f2ed" stroke="#5d9e93"/><text x="314" y="99" text-anchor="middle" font-size="17" font-weight="800" fill="#2e6462">3</text><rect x="338" y="76" width="40" height="34" rx="6" fill="#e3f2ed" stroke="#5d9e93"/><text x="358" y="99" text-anchor="middle" font-size="17" font-weight="800" fill="#2e6462">5</text><rect x="382" y="76" width="40" height="34" rx="6" fill="#e3f2ed" stroke="#5d9e93"/><text x="402" y="99" text-anchor="middle" font-size="17" font-weight="800" fill="#2e6462">7</text></g>
<text x="520" y="98" font-size="13" fill="#526f71" font-family="system-ui,Arial,sans-serif">[1, 3, 5, 7]</text>
<text x="24" y="158" font-size="14" font-weight="750" fill="#137976" font-family="system-ui,Arial,sans-serif">② push(0)：追加到末尾</text>
<g font-family="system-ui,Arial,sans-serif"><rect x="250" y="136" width="40" height="34" rx="6" fill="#e3f2ed" stroke="#5d9e93"/><text x="270" y="159" text-anchor="middle" font-size="17" font-weight="800" fill="#2e6462">1</text><rect x="294" y="136" width="40" height="34" rx="6" fill="#e3f2ed" stroke="#5d9e93"/><text x="314" y="159" text-anchor="middle" font-size="17" font-weight="800" fill="#2e6462">3</text><rect x="338" y="136" width="40" height="34" rx="6" fill="#e3f2ed" stroke="#5d9e93"/><text x="358" y="159" text-anchor="middle" font-size="17" font-weight="800" fill="#2e6462">5</text><rect x="382" y="136" width="40" height="34" rx="6" fill="#e3f2ed" stroke="#5d9e93"/><text x="402" y="159" text-anchor="middle" font-size="17" font-weight="800" fill="#2e6462">7</text><rect x="426" y="136" width="40" height="34" rx="6" fill="#fff4e9" stroke="#cfad82"/><text x="446" y="159" text-anchor="middle" font-size="17" font-weight="800" fill="#2e6462">0</text></g>
<text x="520" y="158" font-size="13" fill="#526f71" font-family="system-ui,Arial,sans-serif">0 &lt; parent(4)=3，交换</text>
<text x="24" y="218" font-size="14" font-weight="750" fill="#137976" font-family="system-ui,Arial,sans-serif">③ 上浮一步</text>
<g font-family="system-ui,Arial,sans-serif"><rect x="250" y="196" width="40" height="34" rx="6" fill="#e3f2ed" stroke="#5d9e93"/><text x="270" y="219" text-anchor="middle" font-size="17" font-weight="800" fill="#2e6462">1</text><rect x="294" y="196" width="40" height="34" rx="6" fill="#fff4e9" stroke="#cfad82"/><text x="314" y="219" text-anchor="middle" font-size="17" font-weight="800" fill="#2e6462">0</text><rect x="338" y="196" width="40" height="34" rx="6" fill="#e3f2ed" stroke="#5d9e93"/><text x="358" y="219" text-anchor="middle" font-size="17" font-weight="800" fill="#2e6462">5</text><rect x="382" y="196" width="40" height="34" rx="6" fill="#e3f2ed" stroke="#5d9e93"/><text x="402" y="219" text-anchor="middle" font-size="17" font-weight="800" fill="#2e6462">7</text><rect x="426" y="196" width="40" height="34" rx="6" fill="#e3f2ed" stroke="#5d9e93"/><text x="446" y="219" text-anchor="middle" font-size="17" font-weight="800" fill="#2e6462">3</text></g>
<text x="520" y="218" font-size="13" fill="#526f71" font-family="system-ui,Arial,sans-serif">0 &lt; parent(1)=1，再交换</text>
<text x="24" y="278" font-size="14" font-weight="750" fill="#137976" font-family="system-ui,Arial,sans-serif">④ 上浮到根，恢复堆序</text>
<g font-family="system-ui,Arial,sans-serif"><rect x="250" y="256" width="40" height="34" rx="6" fill="#fff4e9" stroke="#cfad82"/><text x="270" y="279" text-anchor="middle" font-size="17" font-weight="800" fill="#2e6462">0</text><rect x="294" y="256" width="40" height="34" rx="6" fill="#e3f2ed" stroke="#5d9e93"/><text x="314" y="279" text-anchor="middle" font-size="17" font-weight="800" fill="#2e6462">1</text><rect x="338" y="256" width="40" height="34" rx="6" fill="#e3f2ed" stroke="#5d9e93"/><text x="358" y="279" text-anchor="middle" font-size="17" font-weight="800" fill="#2e6462">5</text><rect x="382" y="256" width="40" height="34" rx="6" fill="#e3f2ed" stroke="#5d9e93"/><text x="402" y="279" text-anchor="middle" font-size="17" font-weight="800" fill="#2e6462">7</text><rect x="426" y="256" width="40" height="34" rx="6" fill="#e3f2ed" stroke="#5d9e93"/><text x="446" y="279" text-anchor="middle" font-size="17" font-weight="800" fill="#2e6462">3</text></g>
<text x="520" y="278" font-size="13" fill="#137976" font-family="system-ui,Arial,sans-serif">堆顶即最小值 0</text>
<line x1="24" y1="304" x2="856" y2="304" stroke="#dce8e4" stroke-width="1.5"/>
<text x="24" y="336" font-size="14" font-weight="750" fill="#137976" font-family="system-ui,Arial,sans-serif">⑤ pop()：末尾 3 移到堆顶</text>
<g font-family="system-ui,Arial,sans-serif"><rect x="250" y="314" width="40" height="34" rx="6" fill="#fff4e9" stroke="#cfad82"/><text x="270" y="337" text-anchor="middle" font-size="17" font-weight="800" fill="#2e6462">3</text><rect x="294" y="314" width="40" height="34" rx="6" fill="#e3f2ed" stroke="#5d9e93"/><text x="314" y="337" text-anchor="middle" font-size="17" font-weight="800" fill="#2e6462">1</text><rect x="338" y="314" width="40" height="34" rx="6" fill="#e3f2ed" stroke="#5d9e93"/><text x="358" y="337" text-anchor="middle" font-size="17" font-weight="800" fill="#2e6462">5</text><rect x="382" y="314" width="40" height="34" rx="6" fill="#e3f2ed" stroke="#5d9e93"/><text x="402" y="337" text-anchor="middle" font-size="17" font-weight="800" fill="#2e6462">7</text></g>
<text x="520" y="336" font-size="13" fill="#526f71" font-family="system-ui,Arial,sans-serif">返回 0；把孩子 1、5 中较小者上提</text>
<text x="24" y="396" font-size="14" font-weight="750" fill="#137976" font-family="system-ui,Arial,sans-serif">⑥ 下沉一步，恢复堆序</text>
<g font-family="system-ui,Arial,sans-serif"><rect x="250" y="374" width="40" height="34" rx="6" fill="#fff4e9" stroke="#cfad82"/><text x="270" y="397" text-anchor="middle" font-size="17" font-weight="800" fill="#2e6462">1</text><rect x="294" y="374" width="40" height="34" rx="6" fill="#e3f2ed" stroke="#5d9e93"/><text x="314" y="397" text-anchor="middle" font-size="17" font-weight="800" fill="#2e6462">3</text><rect x="338" y="374" width="40" height="34" rx="6" fill="#e3f2ed" stroke="#5d9e93"/><text x="358" y="397" text-anchor="middle" font-size="17" font-weight="800" fill="#2e6462">5</text><rect x="382" y="374" width="40" height="34" rx="6" fill="#e3f2ed" stroke="#5d9e93"/><text x="402" y="397" text-anchor="middle" font-size="17" font-weight="800" fill="#2e6462">7</text></g>
<text x="520" y="396" font-size="13" fill="#526f71" font-family="system-ui,Arial,sans-serif">[1, 3, 5, 7]，堆序恢复</text>
</svg>
