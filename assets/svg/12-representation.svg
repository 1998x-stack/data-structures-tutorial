<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" role="img" aria-labelledby="t d">
<title id="t">同一张图的邻接表与邻接矩阵表示</title>
<desc id="d">上方是顶点 0 到 3 的四边形无向图。左下用邻接表逐顶点列出邻居，空间与顶点数加边数成正比；右下用 4×4 邻接矩阵，1 表示存在边，查任意一条边是常数时间但空间随顶点数平方增长。</desc>
<rect width="880" height="480" rx="14" fill="#f9fcf9"/>
<g font-family="system-ui,Arial,sans-serif"><text x="24" y="34" font-size="20" font-weight="750" fill="#234649">同一张图，两种存法</text><text x="24" y="56" font-size="13" fill="#667a7d">选哪种取决于图是稀疏还是稠密，以及你要频繁做“查边”还是“遍历邻居”</text></g>
<g stroke="#8fb3ac" stroke-width="2.5" fill="none"><line x1="410" y1="110" x2="510" y2="110"/><line x1="410" y1="110" x2="410" y2="200"/><line x1="510" y1="110" x2="510" y2="200"/><line x1="410" y1="200" x2="510" y2="200"/></g>
<g fill="#e3f2ed" stroke="#147f80" stroke-width="2.5"><circle cx="410" cy="110" r="21"/><circle cx="510" cy="110" r="21"/><circle cx="510" cy="200" r="21"/><circle cx="410" cy="200" r="21"/></g>
<g font-family="system-ui,Arial,sans-serif" font-size="16" font-weight="800" fill="#245250" text-anchor="middle"><text x="410" y="116">0</text><text x="510" y="116">1</text><text x="510" y="206">2</text><text x="410" y="206">3</text></g>
<text x="24" y="270" font-size="15" font-weight="750" fill="#137976" font-family="system-ui,Arial,sans-serif">邻接表：每个顶点存一张邻居表</text>
<g font-family="ui-monospace,monospace" font-size="14" fill="#2b5454"><text x="24" y="300">0 → [1, 3]</text><text x="24" y="324">1 → [0, 2]</text><text x="24" y="348">2 → [1, 3]</text><text x="24" y="372">3 → [0, 2]</text></g>
<text x="24" y="410" font-size="13" fill="#526f71" font-family="system-ui,Arial,sans-serif">空间 O(n+m)；遍历邻居 O(deg)；查边需扫描邻居表</text>
<text x="470" y="270" font-size="15" font-weight="750" fill="#137976" font-family="system-ui,Arial,sans-serif">邻接矩阵：n×n 记录每对顶点</text>
<g font-family="ui-monospace,monospace" font-size="12" fill="#667a7d" text-anchor="middle"><text x="540" y="300">0</text><text x="578" y="300">1</text><text x="616" y="300">2</text><text x="654" y="300">3</text></g>
<g font-family="ui-monospace,monospace" font-size="12" fill="#667a7d" text-anchor="middle"><text x="512" y="325">0</text><text x="512" y="361">1</text><text x="512" y="397">2</text><text x="512" y="433">3</text></g>
<g stroke="#bcd2cc" stroke-width="1.5"><rect x="522" y="308" width="36" height="36" fill="#fff"/><rect x="558" y="308" width="36" height="36" fill="#dff0eb"/><rect x="594" y="308" width="36" height="36" fill="#fff"/><rect x="630" y="308" width="36" height="36" fill="#dff0eb"/><rect x="522" y="344" width="36" height="36" fill="#dff0eb"/><rect x="558" y="344" width="36" height="36" fill="#fff"/><rect x="594" y="344" width="36" height="36" fill="#dff0eb"/><rect x="630" y="344" width="36" height="36" fill="#fff"/><rect x="522" y="380" width="36" height="36" fill="#fff"/><rect x="558" y="380" width="36" height="36" fill="#dff0eb"/><rect x="594" y="380" width="36" height="36" fill="#fff"/><rect x="630" y="380" width="36" height="36" fill="#dff0eb"/><rect x="522" y="416" width="36" height="36" fill="#dff0eb"/><rect x="558" y="416" width="36" height="36" fill="#fff"/><rect x="594" y="416" width="36" height="36" fill="#dff0eb"/><rect x="630" y="416" width="36" height="36" fill="#fff"/></g>
<g font-family="ui-monospace,monospace" font-size="14" fill="#245250" text-anchor="middle"><text x="540" y="332">0</text><text x="576" y="332">1</text><text x="612" y="332">0</text><text x="648" y="332">1</text><text x="540" y="368">1</text><text x="576" y="368">0</text><text x="612" y="368">1</text><text x="648" y="368">0</text><text x="540" y="404">0</text><text x="576" y="404">1</text><text x="612" y="404">0</text><text x="648" y="404">1</text><text x="540" y="440">1</text><text x="576" y="440">0</text><text x="612" y="440">1</text><text x="648" y="440">0</text></g>
</svg>
