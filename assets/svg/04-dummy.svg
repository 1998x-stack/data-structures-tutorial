<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" role="img" aria-labelledby="t d"><title id="t">dummy 哨兵统一删除头和删除中间节点</title><desc id="d">上方原链 dummy 到 A 到 B 到 C；下方删除 A 后 dummy 改指 B；所有删除都只重写前驱的 next</desc><rect width="880" height="390" rx="14" fill="#f9fcf9"/>
<defs><marker id="a" viewBox="0 0 10 10" markerWidth="7" markerHeight="7" orient="auto" refX="9" refY="5"><path d="M0 0L10 5L0 10Z" fill="#628f88"/></marker></defs>
<g font-family="system-ui,Arial,sans-serif"><text x="28" y="40" font-size="21" font-weight="750" fill="#203f44">删除头节点，不需要专门修改全局 head</text><text x="28" y="62" font-size="13" fill="#627878">所有步骤都只写 prev.next = prev.next.next</text></g>
<g font-family="system-ui,Arial,sans-serif"><text x="28" y="90" font-size="15" font-weight="700" fill="#46676c">初始：dummy → A → B → C</text>
<rect x="195" y="62" width="125" height="62" rx="9" fill="#d9f1ec" stroke="#76a99f" stroke-width="2"/><text x="257" y="99" font-size="16" text-anchor="middle" fill="#235d5a">dummy</text><rect x="363" y="62" width="108" height="62" rx="9" fill="#f4f6f3" stroke="#76a99f" stroke-width="2"/><text x="417" y="99" font-size="19" text-anchor="middle" fill="#235d5a">A</text><rect x="530" y="62" width="108" height="62" rx="9" fill="#f4f6f3" stroke="#76a99f" stroke-width="2"/><text x="584" y="99" font-size="19" text-anchor="middle" fill="#235d5a">B</text><rect x="700" y="62" width="108" height="62" rx="9" fill="#f4f6f3" stroke="#76a99f" stroke-width="2"/><text x="754" y="99" font-size="19" text-anchor="middle" fill="#235d5a">C</text>
</g><g fill="none" stroke="#628f88" stroke-width="2.5" marker-end="url(#a)"><path d="M320 90H362"/><path d="M471 90H529"/><path d="M638 90H699"/></g><g font-family="system-ui,Arial,sans-serif"><text x="28" y="235" font-size="15" font-weight="700" fill="#46676c">删除 A：dummy → B → C</text>
<rect x="195" y="207" width="125" height="62" rx="9" fill="#d9f1ec" stroke="#76a99f" stroke-width="2"/><text x="257" y="244" font-size="16" text-anchor="middle" fill="#235d5a">dummy</text><rect x="363" y="207" width="108" height="62" rx="9" fill="#fff2ea" stroke="#c96e4f" stroke-width="2"/><text x="417" y="244" font-size="19" text-anchor="middle" fill="#ac6041">A（移除）</text><rect x="530" y="207" width="108" height="62" rx="9" fill="#f4f6f3" stroke="#76a99f" stroke-width="2"/><text x="584" y="244" font-size="19" text-anchor="middle" fill="#235d5a">B</text><rect x="700" y="207" width="108" height="62" rx="9" fill="#f4f6f3" stroke="#76a99f" stroke-width="2"/><text x="754" y="244" font-size="19" text-anchor="middle" fill="#235d5a">C</text>
</g><g fill="none" stroke="#1e8b81" stroke-width="2.5" marker-end="url(#a)"><path d="M320 233C390 135,493 135,529 233"/><path d="M638 235H699"/></g><path d="M384 202L440 274 M440 202L384 274" stroke="#c96e4f" stroke-width="2.5"/>
<g font-family="system-ui,Arial,sans-serif" fill="#6e7d7a" font-size="13"><text x="30" y="362">若连续多个节点的值都应删除，prev 保持不动，继续检查新连上的 prev.next。</text></g></svg>