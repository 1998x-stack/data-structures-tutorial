<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" role="img" aria-labelledby="t d">
<title id="t">计数排序：不比较，只用值域做索引</title>
<desc id="d">输入 4,1,3,1,4,2,1 落入值域 1 到 4。统计每个值出现次数得 3,1,1,2，再按值从小到大按次数展开，得到 1,1,1,2,3,4,4。全程不做两两比较，代价 O(n+k)，k 是值域宽度。</desc>
<rect width="880" height="420" rx="14" fill="#f9fcf9"/>
<g font-family="system-ui,Arial,sans-serif"><text x="24" y="36" font-size="20" font-weight="750" fill="#234649">计数排序：用“值”当地址，绕过比较下限</text><text x="24" y="58" font-size="13" fill="#667a7d">基于比较的排序至少要 Ω(n log n) 次比较；利用整数值域可以不做任何比较</text></g>
<g font-family="system-ui,Arial,sans-serif" font-size="13" fill="#667a7d"><text x="24" y="98">输入（值域 1..4）</text><text x="24" y="206">每个值的出现次数</text><text x="24" y="330">按值展开输出</text></g>
<g font-family="system-ui,Arial,sans-serif" font-size="20" font-weight="800" text-anchor="middle" fill="#4d3f86">
<rect x="170" y="74" width="70" height="48" rx="8" fill="#eef0fa" stroke="#7461ba" stroke-width="1.5"/><text x="205" y="106">4</text>
<rect x="248" y="74" width="70" height="48" rx="8" fill="#eef0fa" stroke="#7461ba" stroke-width="1.5"/><text x="283" y="106">1</text>
<rect x="326" y="74" width="70" height="48" rx="8" fill="#eef0fa" stroke="#7461ba" stroke-width="1.5"/><text x="361" y="106">3</text>
<rect x="404" y="74" width="70" height="48" rx="8" fill="#eef0fa" stroke="#7461ba" stroke-width="1.5"/><text x="439" y="106">1</text>
<rect x="482" y="74" width="70" height="48" rx="8" fill="#eef0fa" stroke="#7461ba" stroke-width="1.5"/><text x="517" y="106">4</text>
<rect x="560" y="74" width="70" height="48" rx="8" fill="#eef0fa" stroke="#7461ba" stroke-width="1.5"/><text x="595" y="106">2</text>
<rect x="638" y="74" width="70" height="48" rx="8" fill="#eef0fa" stroke="#7461ba" stroke-width="1.5"/><text x="673" y="106">1</text></g>
<g font-family="system-ui,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#234649">
<rect x="180" y="190" width="80" height="52" rx="8" fill="#e0efe6" stroke="#3f7d5a" stroke-width="2"/><text x="220" y="214">值 1</text><text x="220" y="234" font-size="18">3 次</text>
<rect x="290" y="190" width="80" height="52" rx="8" fill="#e0efe6" stroke="#3f7d5a" stroke-width="2"/><text x="330" y="214">值 2</text><text x="330" y="234" font-size="18">1 次</text>
<rect x="400" y="190" width="80" height="52" rx="8" fill="#e0efe6" stroke="#3f7d5a" stroke-width="2"/><text x="440" y="214">值 3</text><text x="440" y="234" font-size="18">1 次</text>
<rect x="510" y="190" width="80" height="52" rx="8" fill="#e0efe6" stroke="#3f7d5a" stroke-width="2"/><text x="550" y="214">值 4</text><text x="550" y="234" font-size="18">2 次</text></g>
<g font-family="system-ui,Arial,sans-serif" font-size="20" font-weight="800" text-anchor="middle" fill="#234649">
<rect x="250" y="316" width="56" height="48" rx="8" fill="#fff" stroke="#234649" stroke-width="1.5"/><text x="278" y="348">1</text>
<rect x="314" y="316" width="56" height="48" rx="8" fill="#fff" stroke="#234649" stroke-width="1.5"/><text x="342" y="348">1</text>
<rect x="378" y="316" width="56" height="48" rx="8" fill="#fff" stroke="#234649" stroke-width="1.5"/><text x="406" y="348">1</text>
<rect x="442" y="316" width="56" height="48" rx="8" fill="#fff" stroke="#234649" stroke-width="1.5"/><text x="470" y="348">2</text>
<rect x="506" y="316" width="56" height="48" rx="8" fill="#fff" stroke="#234649" stroke-width="1.5"/><text x="534" y="348">3</text>
<rect x="570" y="316" width="56" height="48" rx="8" fill="#fff" stroke="#234649" stroke-width="1.5"/><text x="598" y="348">4</text>
<rect x="634" y="316" width="56" height="48" rx="8" fill="#fff" stroke="#234649" stroke-width="1.5"/><text x="662" y="348">4</text></g>
<text x="24" y="396" font-size="13" fill="#526f71" font-family="system-ui,Arial,sans-serif">代价 O(n + k)：k = max − min + 1。k 很大（如 1 与 10⁹ 混排）时空间会爆炸，反而不如比较排序。</text>
</svg>
