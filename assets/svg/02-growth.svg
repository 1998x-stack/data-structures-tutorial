<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" role="img" aria-labelledby="t d"><title id="t">四种操作增长模型的量级对照</title><desc id="d">对于 n 为 4、8、16 和 32，对比 log2 n、n、n log2 n 与 n 平方的理论操作数量</desc>
<rect width="880" height="390" rx="15" fill="#f9fcf9"/>
<g font-family="system-ui,Arial,sans-serif"><text x="30" y="39" font-size="20" fill="#223f43" font-weight="700">输入扩大 8 倍，算法代价会如何变化？</text><text x="30" y="62" font-size="13" fill="#65767b">数字是理想化函数值，用于比较增长率，不是基准测试时间</text></g>
<rect x="27" y="83" width="826" height="47" rx="8" fill="#e7f1ed"/>
<g font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-size="15" font-weight="700" fill="#2d5555"><text x="134" y="113">n</text><text x="332" y="113">log₂ n</text><text x="488" y="113">n</text><text x="654" y="113">n log₂ n</text><text x="804" y="113">n²</text></g>
<rect x="27" y="134" width="826" height="51" fill="#fffdf9"/><g font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-size="21" fill="#26494b"><text x="134" y="166" font-weight="700">4</text><text x="332" y="166" fill="#137d7b">2</text><text x="488" y="166">4</text><text x="654" y="166" fill="#725db0">8</text><text x="804" y="166" fill="#bd6b4c">16</text></g><rect x="27" y="189" width="826" height="51" fill="#f4f8f5"/><g font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-size="21" fill="#26494b"><text x="134" y="221" font-weight="700">8</text><text x="332" y="221" fill="#137d7b">3</text><text x="488" y="221">8</text><text x="654" y="221" fill="#725db0">24</text><text x="804" y="221" fill="#bd6b4c">64</text></g><rect x="27" y="244" width="826" height="51" fill="#fffdf9"/><g font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-size="21" fill="#26494b"><text x="134" y="276" font-weight="700">16</text><text x="332" y="276" fill="#137d7b">4</text><text x="488" y="276">16</text><text x="654" y="276" fill="#725db0">64</text><text x="804" y="276" fill="#bd6b4c">256</text></g><rect x="27" y="299" width="826" height="51" fill="#f4f8f5"/><g font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-size="21" fill="#26494b"><text x="134" y="331" font-weight="700">32</text><text x="332" y="331" fill="#137d7b">5</text><text x="488" y="331">32</text><text x="654" y="331" fill="#725db0">160</text><text x="804" y="331" fill="#bd6b4c">1024</text></g>
<g font-family="system-ui,Arial,sans-serif" font-size="12" fill="#657979"><text x="30" y="376">结论：同样从 n = 4 到 32，平方量级增长 64 倍，而对数量级只从 2 增至 5。</text></g></svg>