<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" role="img" aria-labelledby="t d"><title id="t">同一棵树的四种遍历顺序</title><desc id="d">树4的左子为2右子为6，2的孩子1和3，6的左子为5。前序421365，中序123456，后序132564，层序426135</desc><rect width="880" height="390" rx="14" fill="#f9fcf9"/>
<g font-family="system-ui,Arial,sans-serif"><text x="27" y="40" font-size="20" font-weight="750" fill="#244649">节点不变，变化的是访问根的时机</text><text x="27" y="63" font-size="13" fill="#63797a">输入树：根 4；左子树 (2,1,3)；右子树 (6,5)</text></g>
<g font-family="system-ui,Arial,sans-serif"><path d="M280 156L173.44 183.76" stroke="#82a69b" stroke-width="2.7" fill="none"/><path d="M280 156L386.56 183.76" stroke="#82a69b" stroke-width="2.7" fill="none"/><path d="M173.44 215.76L112.96000000000001 247.12" stroke="#82a69b" stroke-width="2.7" fill="none"/><path d="M173.44 215.76L233.92000000000002 247.12" stroke="#82a69b" stroke-width="2.7" fill="none"/><path d="M386.56 215.76L326.08 247.12" stroke="#82a69b" stroke-width="2.7" fill="none"/><circle cx="280" cy="140" r="16.56" fill="#e3f2ed" stroke="#5d9e93" stroke-width="2"/><text x="280" y="145.04" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="15.84" font-weight="800" fill="#2e6462">4</text><circle cx="173.44" cy="199.76" r="16.56" fill="#eeeaf8" stroke="#9c90c0" stroke-width="2"/><text x="173.44" y="204.79999999999998" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="15.84" font-weight="800" fill="#2e6462">2</text><circle cx="386.56" cy="199.76" r="16.56" fill="#eeeaf8" stroke="#9c90c0" stroke-width="2"/><text x="386.56" y="204.79999999999998" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="15.84" font-weight="800" fill="#2e6462">6</text><circle cx="112.96000000000001" cy="263.12" r="16.56" fill="#fff4e9" stroke="#cfad82" stroke-width="2"/><text x="112.96000000000001" y="268.16" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="15.84" font-weight="800" fill="#2e6462">1</text><circle cx="233.92000000000002" cy="263.12" r="16.56" fill="#fff4e9" stroke="#cfad82" stroke-width="2"/><text x="233.92000000000002" y="268.16" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="15.84" font-weight="800" fill="#2e6462">3</text><circle cx="326.08" cy="263.12" r="16.56" fill="#fff4e9" stroke="#cfad82" stroke-width="2"/><text x="326.08" y="268.16" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="15.84" font-weight="800" fill="#2e6462">5</text></g>
<g font-family="system-ui,Arial,sans-serif"><rect x="522" y="102" width="333" height="54" rx="9" fill="#dff2ed" stroke="#d6e3dd"/><text x="537" y="122" font-size="13" fill="#647a79">前序</text><text x="537" y="144" font-size="15" font-weight="750" fill="#235e5f">4 → 2 → 1 → 3 → 6 → 5</text></g><g font-family="system-ui,Arial,sans-serif"><rect x="522" y="167" width="333" height="54" rx="9" fill="#f0eafa" stroke="#d6e3dd"/><text x="537" y="187" font-size="13" fill="#647a79">中序</text><text x="537" y="209" font-size="15" font-weight="750" fill="#235e5f">1 → 2 → 3 → 4 → 5 → 6</text></g><g font-family="system-ui,Arial,sans-serif"><rect x="522" y="232" width="333" height="54" rx="9" fill="#fff0e6" stroke="#d6e3dd"/><text x="537" y="252" font-size="13" fill="#647a79">后序</text><text x="537" y="274" font-size="15" font-weight="750" fill="#235e5f">1 → 3 → 2 → 5 → 6 → 4</text></g><g font-family="system-ui,Arial,sans-serif"><rect x="522" y="297" width="333" height="54" rx="9" fill="#e4f3f3" stroke="#d6e3dd"/><text x="537" y="317" font-size="13" fill="#647a79">层序</text><text x="537" y="339" font-size="15" font-weight="750" fill="#235e5f">4 → 2 → 6 → 1 → 3 → 5</text></g>
<g font-family="system-ui,Arial,sans-serif"><text x="27" y="368" font-size="12" fill="#657979">中序恰好有序，是因为此示例满足 BST 约束；普通二叉树没有这个保证。</text></g></svg>