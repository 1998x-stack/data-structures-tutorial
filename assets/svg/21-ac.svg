<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" role="img" aria-labelledby="ac-title ac-desc">
<title id="ac-title">AC 自动机在 Trie 上增加失配指针</title>
<desc id="ac-desc">模式串 abc、bcd、cde 建成三条路径，词尾节点加粗；虚线表示失配指针，节点 ab 失配时转到节点 b，节点 bc 失配时转到节点 c。</desc>
<defs><marker id="ac-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#64748b"/></marker><marker id="ac-fail" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#b45309"/></marker></defs>
<g font-family="-apple-system, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">
<line x1="440" y1="72" x2="220" y2="118" stroke="#64748b" marker-end="url(#ac-arrow)"/>
<line x1="440" y1="72" x2="440" y2="118" stroke="#64748b" marker-end="url(#ac-arrow)"/>
<line x1="440" y1="72" x2="660" y2="118" stroke="#64748b" marker-end="url(#ac-arrow)"/>
<line x1="220" y1="164" x2="220" y2="208" stroke="#64748b" marker-end="url(#ac-arrow)"/>
<line x1="440" y1="164" x2="440" y2="208" stroke="#64748b" marker-end="url(#ac-arrow)"/>
<line x1="660" y1="164" x2="660" y2="208" stroke="#64748b" marker-end="url(#ac-arrow)"/>
<line x1="220" y1="254" x2="220" y2="298" stroke="#64748b" marker-end="url(#ac-arrow)"/>
<line x1="440" y1="254" x2="440" y2="298" stroke="#64748b" marker-end="url(#ac-arrow)"/>
<line x1="660" y1="254" x2="660" y2="298" stroke="#64748b" marker-end="url(#ac-arrow)"/>
<path d="M250 222 C 300 170, 360 150, 412 140" fill="none" stroke="#b45309" stroke-dasharray="5 4" marker-end="url(#ac-fail)"/>
<path d="M470 222 C 520 170, 580 150, 632 140" fill="none" stroke="#b45309" stroke-dasharray="5 4" marker-end="url(#ac-fail)"/>
<circle cx="440" cy="50" r="22" fill="#e2e8f0" stroke="#475569"/><text x="440" y="56" fill="#334155">根</text>
<circle cx="220" cy="140" r="24" fill="#e0e7ff" stroke="#4338ca"/><text x="220" y="146" fill="#312e81">a</text>
<circle cx="440" cy="140" r="24" fill="#e0e7ff" stroke="#4338ca"/><text x="440" y="146" fill="#312e81">b</text>
<circle cx="660" cy="140" r="24" fill="#e0e7ff" stroke="#4338ca"/><text x="660" y="146" fill="#312e81">c</text>
<circle cx="220" cy="230" r="24" fill="#e0e7ff" stroke="#4338ca"/><text x="220" y="236" fill="#312e81">ab</text>
<circle cx="440" cy="230" r="24" fill="#e0e7ff" stroke="#4338ca"/><text x="440" y="236" fill="#312e81">bc</text>
<circle cx="660" cy="230" r="24" fill="#e0e7ff" stroke="#4338ca"/><text x="660" y="236" fill="#312e81">cd</text>
<circle cx="220" cy="320" r="26" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="220" y="326" fill="#14532d">abc</text>
<circle cx="440" cy="320" r="26" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="440" y="326" fill="#14532d">bcd</text>
<circle cx="660" cy="320" r="26" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="660" y="326" fill="#14532d">cde</text>
<text x="700" y="200" font-size="13" fill="#b45309" text-anchor="start">虚线：失配指针</text>
<text x="440" y="366" font-size="13" fill="#14532d">绿框为词尾：在文本中走到它就命中一个模式串</text>
</g></svg>
