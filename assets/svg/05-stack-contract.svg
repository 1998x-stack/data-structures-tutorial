<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" aria-labelledby="t d" role="img"><title id="t">栈的 LIFO 契约</title><desc id="d">三个元素 A B C 依次入栈，弹出顺序为 C B A，每个栈只在顶端操作</desc><rect width="880" height="390" rx="14" fill="#f9fcf9"/>
<defs><marker id="arr" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#51877f"/></marker></defs><g font-family="system-ui,Arial,sans-serif"><text x="30" y="42" font-size="21" font-weight="750" fill="#214549">只允许在顶部 push / pop</text><text x="30" y="64" font-size="13" fill="#5a7173">左边按顺序入栈，右边按相反顺序出栈；整个过程不要求节点连续</text></g>
<g font-family="system-ui,Arial,sans-serif"><text x="245" y="103" font-size="16" text-anchor="middle" font-weight="700" fill="#325d61">1 次 push</text><path d="M185 143V320H310V143" stroke="#7a9f97" stroke-width="3" fill="none"/>
<rect x="195" y="282" width="105" height="40" rx="6" fill="#d8efe8" stroke="#78a9a1"/><text x="247" y="309" fill="#185f5d" text-anchor="middle" font-size="18" font-weight="700">A</text><text x="247" y="351" text-anchor="middle" font-size="13" fill="#6c807b">top = A</text></g><g font-family="system-ui,Arial,sans-serif"><text x="475" y="103" font-size="16" text-anchor="middle" font-weight="700" fill="#325d61">2 次 push</text><path d="M415 143V320H540V143" stroke="#7a9f97" stroke-width="3" fill="none"/>
<rect x="425" y="282" width="105" height="40" rx="6" fill="#f4f6f2" stroke="#78a9a1"/><text x="477" y="309" fill="#185f5d" text-anchor="middle" font-size="18" font-weight="700">A</text><rect x="425" y="234" width="105" height="40" rx="6" fill="#d8efe8" stroke="#78a9a1"/><text x="477" y="261" fill="#185f5d" text-anchor="middle" font-size="18" font-weight="700">B</text><text x="477" y="351" text-anchor="middle" font-size="13" fill="#6c807b">top = B</text></g><g font-family="system-ui,Arial,sans-serif"><text x="705" y="103" font-size="16" text-anchor="middle" font-weight="700" fill="#325d61">3 次 push</text><path d="M645 143V320H770V143" stroke="#7a9f97" stroke-width="3" fill="none"/>
<rect x="655" y="282" width="105" height="40" rx="6" fill="#f4f6f2" stroke="#78a9a1"/><text x="707" y="309" fill="#185f5d" text-anchor="middle" font-size="18" font-weight="700">A</text><rect x="655" y="234" width="105" height="40" rx="6" fill="#f4f6f2" stroke="#78a9a1"/><text x="707" y="261" fill="#185f5d" text-anchor="middle" font-size="18" font-weight="700">B</text><rect x="655" y="186" width="105" height="40" rx="6" fill="#d8efe8" stroke="#78a9a1"/><text x="707" y="213" fill="#185f5d" text-anchor="middle" font-size="18" font-weight="700">C</text><text x="707" y="351" text-anchor="middle" font-size="13" fill="#6c807b">top = C</text></g>
<g stroke="#51877f" stroke-width="2.6" fill="none" marker-end="url(#arr)"><path d="M330 231H396"/><path d="M560 231H626"/></g><g font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-size="13" fill="#6b7778"><text x="763" y="150">弹出顺序</text><text x="763" y="177" font-size="22" font-weight="700" fill="#b97052">C B A</text></g></svg>