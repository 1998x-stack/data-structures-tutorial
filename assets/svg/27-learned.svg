<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 350" width="880" height="350" role="img" aria-labelledby="li-title li-desc">
<title id="li-title">学习型索引用模型预测位置，再在附近局部搜索</title>
<desc id="li-desc">横轴是 key，纵轴是它在有序数组中的位置。模型用一条线近似它的累积分布，直接把 key 映射到大致位置；预测不可能精确，于是在预测位置附近的小窗口内二分查找。</desc>
<defs><marker id="li-axis" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#475569"/></marker></defs>
<g font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">
<line x1="100" y1="285" x2="820" y2="285" stroke="#475569" marker-end="url(#li-axis)"/>
<line x1="100" y1="285" x2="100" y2="45" stroke="#475569" marker-end="url(#li-axis)"/>
<text x="810" y="308" fill="#475569" text-anchor="end">key（有序）</text>
<text x="106" y="40" fill="#475569" text-anchor="start">位置</text>
<line x1="100" y1="280" x2="800" y2="60" stroke="#2563eb" stroke-width="2"/>
<circle cx="100" cy="280" r="4" fill="#2563eb"/><circle cx="200" cy="249" r="4" fill="#2563eb"/><circle cx="300" cy="217" r="4" fill="#2563eb"/><circle cx="400" cy="186" r="4" fill="#2563eb"/>
<circle cx="500" cy="154" r="4" fill="#2563eb"/><circle cx="600" cy="123" r="4" fill="#2563eb"/><circle cx="700" cy="91" r="4" fill="#2563eb"/><circle cx="800" cy="60" r="4" fill="#2563eb"/>
<rect x="428" y="148" width="44" height="48" rx="4" fill="#dcfce7" stroke="#15803d" stroke-dasharray="4 3"/>
<line x1="450" y1="285" x2="450" y2="170" stroke="#b45309" stroke-dasharray="4 3"/>
<line x1="100" y1="170" x2="450" y2="170" stroke="#b45309" stroke-dasharray="4 3"/>
<text x="450" y="300" fill="#b45309">查询 key=8</text>
<text x="150" y="166" fill="#b45309" text-anchor="start">模型给的位置 ≈ 3.5</text>
<text x="450" y="132" fill="#166534">在该窗口内局部二分，得到精确位置</text>
<text x="450" y="338" fill="#475569">模型不需要预测得分毫不差，只要把搜索范围缩得足够小</text>
</g></svg>
