<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" role="img" aria-labelledby="t d"><title id="t">一棵合法的红黑树及其性质</title><desc id="d">根 13 为黑色，红色节点 8 与 17 的孩子都是黑色节点，从根到任一空叶经过的黑色节点数都为 2</desc><rect width="880" height="430" rx="14" fill="#f9fcf9"/>
<g font-family="system-ui,Arial,sans-serif"><text x="24" y="36" font-size="20" font-weight="750" fill="#234649">红黑树：用颜色约束代替严格的平衡因子</text><text x="24" y="60" font-size="13" fill="#667a7d">深色节点为黑，浅色节点为红；颜色只需满足若干局部规则，高度上界便随之成立</text></g>
<path d="M250 130L150 172M250 130L350 172M150 172L95 252M150 172L205 252M350 172L300 252M350 172L405 252" stroke="#8a9a99" stroke-width="2.4" fill="none"/>
<circle cx="250" cy="110" r="21" fill="#2f4f4f" stroke="#1f3737" stroke-width="2"/><text x="250" y="117" text-anchor="middle" font-size="18" font-weight="800" fill="#f4fbfa">13</text>
<circle cx="150" cy="190" r="21" fill="#f7d0c8" stroke="#c8664c" stroke-width="2.2"/><text x="150" y="197" text-anchor="middle" font-size="18" font-weight="800" fill="#a63d29">8</text>
<circle cx="350" cy="190" r="21" fill="#f7d0c8" stroke="#c8664c" stroke-width="2.2"/><text x="350" y="197" text-anchor="middle" font-size="18" font-weight="800" fill="#a63d29">17</text>
<circle cx="95" cy="270" r="20" fill="#2f4f4f" stroke="#1f3737" stroke-width="2"/><text x="95" y="277" text-anchor="middle" font-size="17" font-weight="800" fill="#f4fbfa">1</text>
<circle cx="205" cy="270" r="20" fill="#2f4f4f" stroke="#1f3737" stroke-width="2"/><text x="205" y="277" text-anchor="middle" font-size="17" font-weight="800" fill="#f4fbfa">11</text>
<circle cx="300" cy="270" r="20" fill="#2f4f4f" stroke="#1f3737" stroke-width="2"/><text x="300" y="277" text-anchor="middle" font-size="17" font-weight="800" fill="#f4fbfa">15</text>
<circle cx="405" cy="270" r="20" fill="#2f4f4f" stroke="#1f3737" stroke-width="2"/><text x="405" y="277" text-anchor="middle" font-size="17" font-weight="800" fill="#f4fbfa">25</text>
<g font-family="system-ui,Arial,sans-serif" font-size="13" fill="#8a5a4c"><text x="40" y="330">13 → 8 → 1 → NIL：黑色节点 13、1</text><text x="40" y="352">13 → 17 → 25 → NIL：黑色节点 13、25</text><text x="40" y="378" fill="#137976">两条路径黑高相同，都等于 2</text><text x="40" y="404" fill="#526f71">最长路径至多是最短路径的两倍</text></g>
<line x1="470" y1="90" x2="470" y2="404" stroke="#dce8e4" stroke-width="2" stroke-dasharray="6 7"/>
<g font-family="system-ui,Arial,sans-serif" font-size="15" fill="#3c5658">
<text x="500" y="112" font-weight="750" fill="#234649">五条性质</text>
<text x="500" y="146">1. 每个节点非红即黑</text>
<text x="500" y="176">2. 根节点是黑色</text>
<text x="500" y="206">3. 空叶（NIL）视为黑色</text>
<text x="500" y="236">4. 红节点的孩子必须是黑色</text>
<text x="500" y="266">5. 从任一节点到其后代 NIL 的</text>
<text x="524" y="290">黑色节点数都相同（黑高）</text>
<text x="500" y="326" fill="#137976">性质 4 与 5 合起来给出高度上界</text>
<text x="500" y="350" fill="#137976">h ≤ 2·log₂(n+1)</text>
<text x="500" y="382" fill="#526f71">每条最长路径的红节点不连续，</text>
<text x="500" y="404" fill="#526f71">因此不会超过黑高的两倍。</text></g>
</svg>
