<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" role="img" aria-labelledby="t d"><title id="t">DFS 和 BFS 的待处理节点次序</title><desc id="d">使用栈先深入左子树，用队列先访问第1层兄弟节点，再访问下层，给出各自遍历序列</desc><rect width="880" height="390" rx="14" fill="#f9fcf9"/>
<g font-family="system-ui,Arial,sans-serif"><text x="27" y="40" font-size="20" font-weight="750" fill="#23484b">同一棵树：栈让路径深入，队列让层次扩展</text><text x="27" y="64" font-size="13" fill="#607779">下方分别显示前序 DFS 与层序 BFS 的访问次序</text></g>
<g font-family="system-ui,Arial,sans-serif"><path d="M250 141L149.36 165.44" stroke="#82a69b" stroke-width="2.7" fill="none"/><path d="M250 141L350.64 165.44" stroke="#82a69b" stroke-width="2.7" fill="none"/><path d="M149.36 197.44L92.23999999999998 225.28000000000003" stroke="#82a69b" stroke-width="2.7" fill="none"/><path d="M149.36 197.44L206.48 225.28000000000003" stroke="#82a69b" stroke-width="2.7" fill="none"/><path d="M350.64 197.44L293.52 225.28000000000003" stroke="#82a69b" stroke-width="2.7" fill="none"/><circle cx="250" cy="125" r="15.64" fill="#e3f2ed" stroke="#5d9e93" stroke-width="2"/><text x="250" y="129.76" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="14.96" font-weight="800" fill="#2e6462">4</text><circle cx="149.36" cy="181.44" r="15.64" fill="#eeeaf8" stroke="#9c90c0" stroke-width="2"/><text x="149.36" y="186.2" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="14.96" font-weight="800" fill="#2e6462">2</text><circle cx="350.64" cy="181.44" r="15.64" fill="#eeeaf8" stroke="#9c90c0" stroke-width="2"/><text x="350.64" y="186.2" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="14.96" font-weight="800" fill="#2e6462">6</text><circle cx="92.23999999999998" cy="241.28000000000003" r="15.64" fill="#fff4e9" stroke="#cfad82" stroke-width="2"/><text x="92.23999999999998" y="246.04000000000002" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="14.96" font-weight="800" fill="#2e6462">1</text><circle cx="206.48" cy="241.28000000000003" r="15.64" fill="#fff4e9" stroke="#cfad82" stroke-width="2"/><text x="206.48" y="246.04000000000002" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="14.96" font-weight="800" fill="#2e6462">3</text><circle cx="293.52" cy="241.28000000000003" r="15.64" fill="#fff4e9" stroke="#cfad82" stroke-width="2"/><text x="293.52" y="246.04000000000002" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="14.96" font-weight="800" fill="#2e6462">5</text></g>
<g font-family="system-ui,Arial,sans-serif"><rect x="500" y="101" width="345" height="110" rx="11" fill="#f0ebf8" stroke="#b2a7cb"/><text x="520" y="130" fill="#735e9e" font-size="18" font-weight="800">栈 / DFS</text><text x="520" y="155" fill="#4d5d6b" font-size="14">先进右，再进左，左边先弹出</text><text x="520" y="183" fill="#5c508e" font-size="17" font-weight="750">4 → 2 → 1 → 3 → 6 → 5</text>
<rect x="500" y="229" width="345" height="111" rx="11" fill="#e2f2eb" stroke="#7eaf9e"/><text x="520" y="259" fill="#217a72" font-size="18" font-weight="800">队列 / BFS</text><text x="520" y="284" fill="#4b6e6b" font-size="14">先弹出本层节点，再展开孩子</text><text x="520" y="311" fill="#27655c" font-size="17" font-weight="750">4 → 2 → 6 → 1 → 3 → 5</text>
<text x="27" y="372" font-size="13" fill="#6c7c79">DFS 的路径空间与树高相关；BFS 的队列空间与最大层宽相关。</text></g></svg>