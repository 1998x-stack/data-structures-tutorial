<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" role="img" aria-labelledby="t d">
<title id="t">同一张图的深度优先与广度优先遍历顺序</title>
<desc id="d">左侧是以顶点 0 为起点的无向图。广度优先用队列按层扩张，访问顺序为 0,1,2,3,4；深度优先用栈一路深入，访问顺序为 0,1,3,2,4。只有广度优先能保证第一次到达就是无权图的最少边数。</desc>
<rect width="880" height="420" rx="14" fill="#f9fcf9"/>
<g font-family="system-ui,Arial,sans-serif"><text x="24" y="34" font-size="20" font-weight="750" fill="#234649">同一张图，两种走法</text><text x="24" y="56" font-size="13" fill="#667a7d">起点都是 0；栈是后进先出，队列是先进先出，这决定了访问顺序</text></g>
<g stroke="#8fb3ac" stroke-width="2.5" fill="none"><line x1="240" y1="110" x2="150" y2="200"/><line x1="240" y1="110" x2="330" y2="200"/><line x1="150" y1="200" x2="240" y2="290"/><line x1="330" y1="200" x2="240" y2="290"/><line x1="240" y1="290" x2="240" y2="370"/></g>
<g fill="#e3f2ed" stroke="#147f80" stroke-width="2.5"><circle cx="240" cy="110" r="22"/><circle cx="150" cy="200" r="22"/><circle cx="330" cy="200" r="22"/><circle cx="240" cy="290" r="22"/><circle cx="240" cy="370" r="22"/></g>
<g font-family="system-ui,Arial,sans-serif" font-size="16" font-weight="800" fill="#245250" text-anchor="middle"><text x="240" y="116">0</text><text x="150" y="206">1</text><text x="330" y="206">2</text><text x="240" y="296">3</text><text x="240" y="376">4</text></g>
<text x="120" y="98" font-size="12" fill="#526f71" font-family="system-ui,Arial,sans-serif">第 0 层</text>
<text x="112" y="182" font-size="12" fill="#526f71" font-family="system-ui,Arial,sans-serif">第 1 层</text>
<text x="168" y="272" font-size="12" fill="#526f71" font-family="system-ui,Arial,sans-serif">第 2 层</text>
<text x="168" y="352" font-size="12" fill="#526f71" font-family="system-ui,Arial,sans-serif">第 3 层</text>
<text x="500" y="112" font-size="16" font-weight="750" fill="#137976" font-family="system-ui,Arial,sans-serif">广度优先 BFS · 队列</text>
<text x="500" y="140" font-size="13" fill="#526f71" font-family="system-ui,Arial,sans-serif">0 → 1,2 → 3 → 4，逐层扩张</text>
<text x="500" y="166" font-size="15" fill="#245250" font-family="ui-monospace,monospace">访问序列：0, 1, 2, 3, 4</text>
<text x="500" y="192" font-size="13" fill="#147f80" font-family="system-ui,Arial,sans-serif">第一次到达目标，边数一定最少</text>
<line x1="500" y1="216" x2="856" y2="216" stroke="#dce8e4" stroke-width="1.5"/>
<text x="500" y="252" font-size="16" font-weight="750" fill="#7461ba" font-family="system-ui,Arial,sans-serif">深度优先 DFS · 栈</text>
<text x="500" y="280" font-size="13" fill="#526f71" font-family="system-ui,Arial,sans-serif">0 → 1 → 3 → 2 → 4，一条路走到底再回溯</text>
<text x="500" y="306" font-size="15" fill="#245250" font-family="ui-monospace,monospace">访问序列：0, 1, 3, 2, 4</text>
<text x="500" y="332" font-size="13" fill="#7461ba" font-family="system-ui,Arial,sans-serif">不能保证无权图的最短路径</text>
<text x="500" y="372" font-size="13" fill="#526f71" font-family="system-ui,Arial,sans-serif">两种遍历都只访问每个顶点一次，</text>
<text x="500" y="392" font-size="13" fill="#526f71" font-family="system-ui,Arial,sans-serif">代价 O(n+m)，差别在“先深”还是“先广”。</text>
</svg>
