<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" role="img" aria-labelledby="t d">
<title id="t">活动选择：按结束时间最早挑出最多不重叠区间</title>
<desc id="d">11 个活动按结束时间排序后顺序尝试：选中 (1,4)，其结束时间为 4，此后跳过所有开始早于 4 的活动，再选 (5,7)、(8,11)、(12,14)，共 4 个互不重叠的活动。结束越早，留给后续的时间越多，所以这个贪心策略最优。</desc>
<rect width="880" height="430" rx="14" fill="#f9fcf9"/>
<g font-family="system-ui,Arial,sans-serif"><text x="24" y="34" font-size="20" font-weight="750" fill="#234649">活动选择：越早结束，留给后面越多时间</text><text x="24" y="56" font-size="13" fill="#667a7d">按结束时间升序扫描，只要开始时间不早于上一个选中活动的结束时间，就选中它</text></g>
<g font-family="system-ui,Arial,sans-serif" font-size="11" fill="#667a7d" text-anchor="middle">
<text x="100" y="82">0</text><text x="200" y="82">2</text><text x="300" y="82">4</text><text x="400" y="82">6</text><text x="500" y="82">8</text><text x="600" y="82">10</text><text x="700" y="82">12</text><text x="800" y="82">14</text></g>
<g font-family="system-ui,Arial,sans-serif" font-size="12">
<rect x="150" y="90" width="150" height="22" rx="5" fill="#e6f2ea" stroke="#3f7d5a" stroke-width="2"/><text x="155" y="106" fill="#2f6047">(1,4) ✓</text>
<rect x="250" y="118" width="100" height="22" rx="5" fill="#eef0fa" stroke="#8fa0c0" stroke-width="1.2"/><text x="255" y="134" fill="#4d3f86">(3,5)</text>
<rect x="100" y="146" width="300" height="22" rx="5" fill="#eef0fa" stroke="#8fa0c0" stroke-width="1.2"/><text x="105" y="162" fill="#4d3f86">(0,6)</text>
<rect x="350" y="174" width="100" height="22" rx="5" fill="#e6f2ea" stroke="#3f7d5a" stroke-width="2"/><text x="355" y="190" fill="#2f6047">(5,7) ✓</text>
<rect x="250" y="202" width="250" height="22" rx="5" fill="#eef0fa" stroke="#8fa0c0" stroke-width="1.2"/><text x="255" y="218" fill="#4d3f86">(3,8)</text>
<rect x="350" y="230" width="200" height="22" rx="5" fill="#eef0fa" stroke="#8fa0c0" stroke-width="1.2"/><text x="355" y="246" fill="#4d3f86">(5,9)</text>
<rect x="400" y="258" width="200" height="22" rx="5" fill="#eef0fa" stroke="#8fa0c0" stroke-width="1.2"/><text x="405" y="274" fill="#4d3f86">(6,10)</text>
<rect x="500" y="286" width="150" height="22" rx="5" fill="#e6f2ea" stroke="#3f7d5a" stroke-width="2"/><text x="505" y="302" fill="#2f6047">(8,11) ✓</text>
<rect x="500" y="314" width="200" height="22" rx="5" fill="#eef0fa" stroke="#8fa0c0" stroke-width="1.2"/><text x="505" y="330" fill="#4d3f86">(8,12)</text>
<rect x="200" y="342" width="550" height="22" rx="5" fill="#eef0fa" stroke="#8fa0c0" stroke-width="1.2"/><text x="205" y="358" fill="#4d3f86">(2,13)</text>
<rect x="700" y="370" width="100" height="22" rx="5" fill="#e6f2ea" stroke="#3f7d5a" stroke-width="2"/><text x="705" y="386" fill="#2f6047">(12,14) ✓</text>
</g>
<text x="24" y="414" font-size="13" fill="#526f71" font-family="system-ui,Arial,sans-serif">绿色为选中的 4 个活动。若按“开始最早”或“最长”排序，都会在构造的例子中少选，因此“按结束时间最早”才是对的不变量。</text>
</svg>
