<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" role="img" aria-labelledby="t d"><title id="t">滑动窗口最大值的候选淘汰</title><desc id="d">新值5到来时，过期索引1移出队首，而较小的索引3和2从队尾移除，最后索引4成为最大值候选</desc><rect width="880" height="390" rx="14" fill="#f9fcf9"/>
<defs><marker id="a" viewBox="0 0 10 10" markerWidth="7" markerHeight="7" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#568981"/></marker></defs><g font-family="system-ui,Arial,sans-serif"><text x="28" y="38" font-size="20" font-weight="750" fill="#26464a">窗口从 [1,3] 移到 [2,4]：为什么 5 可以淘汰旧候选？</text><text x="28" y="60" font-size="13" fill="#627678">不变量：下标递增；对应值严格递减；队首最大</text></g>
<g font-family="system-ui,Arial,sans-serif"><rect x="28" y="96" width="94" height="66" rx="8" fill="#fff" stroke="#b7ccc6" stroke-width="1"/><text x="75" y="135" font-size="23" text-anchor="middle" fill="#216a67" font-weight="750">1</text><text x="75" y="182" text-anchor="middle" font-size="12" fill="#667b7a">i=0</text></g><g font-family="system-ui,Arial,sans-serif"><rect x="131" y="96" width="94" height="66" rx="8" fill="#fff" stroke="#b7ccc6" stroke-width="1"/><text x="178" y="135" font-size="23" text-anchor="middle" fill="#216a67" font-weight="750">3</text><text x="178" y="182" text-anchor="middle" font-size="12" fill="#667b7a">i=1</text></g><g font-family="system-ui,Arial,sans-serif"><rect x="234" y="96" width="94" height="66" rx="8" fill="#e3f2ec" stroke="#4e9b92" stroke-width="2"/><text x="281" y="135" font-size="23" text-anchor="middle" fill="#216a67" font-weight="750">-1</text><text x="281" y="182" text-anchor="middle" font-size="12" fill="#667b7a">i=2</text></g><g font-family="system-ui,Arial,sans-serif"><rect x="337" y="96" width="94" height="66" rx="8" fill="#e3f2ec" stroke="#4e9b92" stroke-width="2"/><text x="384" y="135" font-size="23" text-anchor="middle" fill="#216a67" font-weight="750">-3</text><text x="384" y="182" text-anchor="middle" font-size="12" fill="#667b7a">i=3</text></g><g font-family="system-ui,Arial,sans-serif"><rect x="440" y="96" width="94" height="66" rx="8" fill="#e3f2ec" stroke="#4e9b92" stroke-width="2"/><text x="487" y="135" font-size="23" text-anchor="middle" fill="#216a67" font-weight="750">5</text><text x="487" y="182" text-anchor="middle" font-size="12" fill="#667b7a">i=4</text></g><g font-family="system-ui,Arial,sans-serif"><rect x="543" y="96" width="94" height="66" rx="8" fill="#fff" stroke="#b7ccc6" stroke-width="1"/><text x="590" y="135" font-size="23" text-anchor="middle" fill="#216a67" font-weight="750">3</text><text x="590" y="182" text-anchor="middle" font-size="12" fill="#667b7a">i=5</text></g><g font-family="system-ui,Arial,sans-serif"><rect x="646" y="96" width="94" height="66" rx="8" fill="#fff" stroke="#b7ccc6" stroke-width="1"/><text x="693" y="135" font-size="23" text-anchor="middle" fill="#216a67" font-weight="750">6</text><text x="693" y="182" text-anchor="middle" font-size="12" fill="#667b7a">i=6</text></g><g font-family="system-ui,Arial,sans-serif"><rect x="749" y="96" width="94" height="66" rx="8" fill="#fff" stroke="#b7ccc6" stroke-width="1"/><text x="796" y="135" font-size="23" text-anchor="middle" fill="#216a67" font-weight="750">7</text><text x="796" y="182" text-anchor="middle" font-size="12" fill="#667b7a">i=7</text></g>
<rect x="28" y="206" width="823" height="69" rx="9" fill="#f0f3fa"/><g font-family="system-ui,Arial,sans-serif"><text x="44" y="230" font-size="15" font-weight="750" fill="#68599a">处理 i = 4 之前：候选下标 [1,2,3]，对应值 [3,-1,-3]</text><text x="44" y="256" font-size="14" fill="#776ba4">① 索引1已过期 ② 5 比 -3、-1 更大，依次从队尾淘汰旧候选</text></g>
<rect x="28" y="295" width="823" height="65" rx="9" fill="#e7f4ef"/><g font-family="system-ui,Arial,sans-serif"><text x="44" y="320" font-size="16" font-weight="750" fill="#206964">现在：候选下标 [4]，队首值 5 即区间 [-1,-3,5] 的最大值</text><text x="44" y="345" font-size="13" fill="#617b75">每个下标仅入队一次，从队首或队尾离开至多一次，因此总 O(n)。</text></g></svg>