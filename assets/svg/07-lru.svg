<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" role="img" aria-labelledby="t d"><title id="t">容量3的 LRU 最近使用顺序</title><desc id="d">初始从旧到新 A B C，访问A变 B C A，插入D淘汰B，最终为 C A D</desc><rect width="880" height="390" rx="14" fill="#f9fcf9"/>
<defs><marker id="a" viewBox="0 0 10 10" markerWidth="7" markerHeight="7" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6c9c92"/></marker></defs><g font-family="system-ui,Arial,sans-serif"><text x="28" y="40" fill="#214548" font-size="20" font-weight="750">一次访问改变顺序，一次插入触发淘汰</text><text x="28" y="63" fill="#647a79" font-size="13">顺序从左到右：最久未用（LRU）→ 最近使用（MRU）</text></g>
<g font-family="system-ui,Arial,sans-serif"><text x="40" y="128" font-size="17" fill="#385c5d" font-weight="750">初始</text><rect x="244" y="99" width="125" height="64" rx="10" fill="#f4f4fa" stroke="#9fb4ae"/><text x="306" y="140" text-anchor="middle" fill="#245e60" font-size="23" font-weight="800">A</text><rect x="404" y="99" width="125" height="64" rx="10" fill="#f4f4fa" stroke="#9fb4ae"/><text x="466" y="140" text-anchor="middle" fill="#245e60" font-size="23" font-weight="800">B</text><rect x="564" y="99" width="125" height="64" rx="10" fill="#f4f4fa" stroke="#9fb4ae"/><text x="626" y="140" text-anchor="middle" fill="#245e60" font-size="23" font-weight="800">C</text></g><g font-family="system-ui,Arial,sans-serif"><text x="40" y="223" font-size="17" fill="#385c5d" font-weight="750">访问 A</text><rect x="244" y="194" width="125" height="64" rx="10" fill="#fff0e6" stroke="#d39875"/><text x="306" y="235" text-anchor="middle" fill="#245e60" font-size="23" font-weight="800">B</text><rect x="404" y="194" width="125" height="64" rx="10" fill="#f4f4fa" stroke="#9fb4ae"/><text x="466" y="235" text-anchor="middle" fill="#245e60" font-size="23" font-weight="800">C</text><rect x="564" y="194" width="125" height="64" rx="10" fill="#f4f4fa" stroke="#9fb4ae"/><text x="626" y="235" text-anchor="middle" fill="#245e60" font-size="23" font-weight="800">A</text></g><g font-family="system-ui,Arial,sans-serif"><text x="40" y="318" font-size="17" fill="#385c5d" font-weight="750">插入 D</text><rect x="244" y="289" width="125" height="64" rx="10" fill="#f4f4fa" stroke="#9fb4ae"/><text x="306" y="330" text-anchor="middle" fill="#245e60" font-size="23" font-weight="800">C</text><rect x="404" y="289" width="125" height="64" rx="10" fill="#f4f4fa" stroke="#9fb4ae"/><text x="466" y="330" text-anchor="middle" fill="#245e60" font-size="23" font-weight="800">A</text><rect x="564" y="289" width="125" height="64" rx="10" fill="#d7f0e7" stroke="#46998f"/><text x="626" y="330" text-anchor="middle" fill="#245e60" font-size="23" font-weight="800">D</text></g>
<g font-family="system-ui,Arial,sans-serif"><text x="756" y="134" font-size="13" fill="#a86a4b">A 尚未淘汰</text><text x="756" y="229" font-size="13" fill="#a86a4b">B 现在最旧</text><text x="756" y="324" font-size="13" fill="#a86a4b">B 被淘汰</text><text x="28" y="379" font-size="12" fill="#637977">查找由哈希映射完成；已知节点的位置移动由链表关系完成。</text></g></svg>