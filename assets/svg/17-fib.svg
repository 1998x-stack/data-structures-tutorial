<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" role="img" aria-labelledby="t d">
<title id="t">斐波那契的递归树：重叠子问题被反复计算</title>
<desc id="d">计算 fib(5) 展开成递归树，fib(3) 出现了两次、fib(2) 出现三次、fib(1) 出现两次，同一个子问题被重复求解。总节点数随 n 指数增长。把这些重复结果缓存下来，每个子问题只算一次，就把复杂度降到 O(n)。</desc>
<rect width="880" height="430" rx="14" fill="#f9fcf9"/>
<g font-family="system-ui,Arial,sans-serif"><text x="24" y="34" font-size="20" font-weight="750" fill="#234649">重叠子问题：同一棵子树被算了又算</text><text x="24" y="56" font-size="13" fill="#667a7d">橙色节点的值都曾被重复求过；缓存一份就够，这正是 DP 提速的来源</text></g>
<g stroke="#7d8fb3" stroke-width="1.8" fill="none">
<line x1="420" y1="90" x2="250" y2="140"/><line x1="460" y1="90" x2="630" y2="140"/>
<line x1="215" y1="180" x2="140" y2="230"/><line x1="245" y1="180" x2="320" y2="230"/>
<line x1="635" y1="180" x2="565" y2="230"/><line x1="665" y1="180" x2="740" y2="230"/>
<line x1="100" y1="270" x2="90" y2="320"/><line x1="140" y1="270" x2="160" y2="320"/></g>
<g font-family="system-ui,Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#4d3f86">
<rect x="395" y="50" width="90" height="40" rx="8" fill="#eef0fa" stroke="#7461ba" stroke-width="2"/><text x="440" y="76">fib(5)</text>
<rect x="185" y="140" width="90" height="40" rx="8" fill="#eef0fa" stroke="#7461ba" stroke-width="2"/><text x="230" y="166">fib(4)</text>
<rect x="605" y="140" width="90" height="40" rx="8" fill="#fdece4" stroke="#b25a3a" stroke-width="2.5"/><text x="650" y="166" fill="#8f3f22">fib(3)</text>
<rect x="75" y="230" width="90" height="40" rx="8" fill="#fdece4" stroke="#b25a3a" stroke-width="2.5"/><text x="120" y="256" fill="#8f3f22">fib(3)</text>
<rect x="295" y="230" width="90" height="40" rx="8" fill="#fdece4" stroke="#b25a3a" stroke-width="2.5"/><text x="340" y="256" fill="#8f3f22">fib(2)</text>
<rect x="500" y="230" width="90" height="40" rx="8" fill="#fdece4" stroke="#b25a3a" stroke-width="2.5"/><text x="545" y="256" fill="#8f3f22">fib(2)</text>
<rect x="715" y="230" width="90" height="40" rx="8" fill="#fdece4" stroke="#b25a3a" stroke-width="2.5"/><text x="760" y="256" fill="#8f3f22">fib(1)</text>
<rect x="25" y="320" width="90" height="40" rx="8" fill="#fdece4" stroke="#b25a3a" stroke-width="2.5"/><text x="70" y="346" fill="#8f3f22">fib(2)</text>
<rect x="135" y="320" width="90" height="40" rx="8" fill="#fdece4" stroke="#b25a3a" stroke-width="2.5"/><text x="180" y="346" fill="#8f3f22">fib(1)</text></g>
<text x="300" y="392" font-size="13" fill="#8f3f22" font-family="system-ui,Arial,sans-serif">fib(3) 被算 2 次，fib(2) 被算 3 次，fib(1) 被算 2 次——越多重复，缓存收益越大。</text>
<text x="24" y="416" font-size="13" fill="#526f71" font-family="system-ui,Arial,sans-serif">节点数约随 φⁿ 增长（φ≈1.618），所以朴素递归是 O(2ⁿ)；记忆化后每个 fib(k) 只算一次。</text>
</svg>
