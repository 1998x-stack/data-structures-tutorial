<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" role="img" aria-labelledby="t d"><title id="t">二叉树的深度与高度</title><desc id="d">根4深度0，孩子2和6深度1，叶1 3 5深度2，树高2条边</desc><rect width="880" height="390" rx="14" fill="#f9fcf9"/>
<g font-family="system-ui,Arial,sans-serif"><text x="25" y="39" font-size="20" font-weight="750" fill="#234649">节点深度从根向下计；节点高度向最远叶计</text><text x="25" y="64" font-size="13" fill="#667a7d">本章约定按边数计数：根深度 0、叶高度 0、空树高度 -1</text></g>
<path d="M480 126L332 177" stroke="#82a69b" stroke-width="2.7" fill="none"/><path d="M480 126L628 177" stroke="#82a69b" stroke-width="2.7" fill="none"/><path d="M332 209L248 265" stroke="#82a69b" stroke-width="2.7" fill="none"/><path d="M332 209L416 265" stroke="#82a69b" stroke-width="2.7" fill="none"/><path d="M628 209L544 265" stroke="#82a69b" stroke-width="2.7" fill="none"/><circle cx="480" cy="110" r="23" fill="#e3f2ed" stroke="#5d9e93" stroke-width="2"/><text x="480" y="117" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="22" font-weight="800" fill="#2e6462">4</text><circle cx="332" cy="193" r="23" fill="#eeeaf8" stroke="#9c90c0" stroke-width="2"/><text x="332" y="200" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="22" font-weight="800" fill="#2e6462">2</text><circle cx="628" cy="193" r="23" fill="#eeeaf8" stroke="#9c90c0" stroke-width="2"/><text x="628" y="200" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="22" font-weight="800" fill="#2e6462">6</text><circle cx="248" cy="281" r="23" fill="#fff4e9" stroke="#cfad82" stroke-width="2"/><text x="248" y="288" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="22" font-weight="800" fill="#2e6462">1</text><circle cx="416" cy="281" r="23" fill="#fff4e9" stroke="#cfad82" stroke-width="2"/><text x="416" y="288" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="22" font-weight="800" fill="#2e6462">3</text><circle cx="544" cy="281" r="23" fill="#fff4e9" stroke="#cfad82" stroke-width="2"/><text x="544" y="288" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="22" font-weight="800" fill="#2e6462">5</text>
<g font-family="system-ui,Arial,sans-serif" font-size="15" fill="#526f71"><text x="34" y="116">depth = 0</text><text x="34" y="198">depth = 1</text><text x="34" y="287">depth = 2</text><text x="698" y="123" font-weight="750" fill="#137976">height(root) = 2</text><text x="698" y="151" fill="#7b6d91">height(2) = 1</text><text x="698" y="179" fill="#9f7252">height(leaf) = 0</text><text x="28" y="371" fill="#62777b" font-size="13">右子树根 6 只有左孩子 5，二叉树并不要求两边孩子都存在。</text></g></svg>