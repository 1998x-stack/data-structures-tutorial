<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 720" role="img" aria-labelledby="t d"><title id="t">二叉搜索树删除的三种情况</title><desc id="d">叶子节点直接摘除；只有一个孩子时由孩子顶替；有两个孩子时用右子树的最小值（中序后继）替换其值，再删除原来的后继节点</desc><rect width="880" height="720" rx="14" fill="#f9fcf9"/>
<g font-family="system-ui,Arial,sans-serif"><text x="24" y="36" font-size="20" font-weight="750" fill="#234649">删除：按被删节点的孩子数量分三种情况</text><text x="24" y="60" font-size="13" fill="#667a7d">红色节点为待删目标；左为操作前，右为操作后，删除后仍须满足全子树区间约束</text></g>

<text x="24" y="100" font-size="15" font-weight="750" fill="#137976" font-family="system-ui,Arial,sans-serif">① 叶子：摘除后父指针置空</text>
<path d="M225 136L275 178" stroke="#82a69b" stroke-width="2.6" fill="none"/>
<circle cx="225" cy="120" r="19" fill="#e3f2ed" stroke="#5d9e93" stroke-width="2"/><text x="225" y="126" text-anchor="middle" font-size="18" font-weight="800" fill="#2e6462">8</text>
<circle cx="275" cy="196" r="19" fill="#fdece8" stroke="#c8664c" stroke-width="2.4"/><text x="275" y="202" text-anchor="middle" font-size="18" font-weight="800" fill="#a63d29">3</text>
<text x="410" y="168" font-size="30" fill="#8fb3ab" font-family="system-ui,Arial,sans-serif">⟶</text>
<circle cx="630" cy="140" r="19" fill="#e3f2ed" stroke="#5d9e93" stroke-width="2"/><text x="630" y="146" text-anchor="middle" font-size="18" font-weight="800" fill="#2e6462">8</text>
<text x="668" y="146" font-size="14" fill="#526f71" font-family="system-ui,Arial,sans-serif">8 的左孩子变为 None</text>
<line x1="24" y1="232" x2="856" y2="232" stroke="#dce8e4" stroke-width="1.5"/>

<text x="24" y="272" font-size="15" font-weight="750" fill="#137976" font-family="system-ui,Arial,sans-serif">② 一个孩子：由唯一孩子顶替</text>
<path d="M225 308L275 348M275 382L235 420" stroke="#82a69b" stroke-width="2.6" fill="none"/>
<circle cx="225" cy="292" r="19" fill="#e3f2ed" stroke="#5d9e93" stroke-width="2"/><text x="225" y="298" text-anchor="middle" font-size="18" font-weight="800" fill="#2e6462">8</text>
<circle cx="275" cy="366" r="19" fill="#fdece8" stroke="#c8664c" stroke-width="2.4"/><text x="275" y="372" text-anchor="middle" font-size="18" font-weight="800" fill="#a63d29">3</text>
<circle cx="228" cy="436" r="16" fill="#eeeaf8" stroke="#9c90c0" stroke-width="2"/><text x="228" y="441" text-anchor="middle" font-size="15" font-weight="800" fill="#2e6462">2</text>
<text x="410" y="355" font-size="30" fill="#8fb3ab" font-family="system-ui,Arial,sans-serif">⟶</text>
<path d="M630 328L578 384" stroke="#82a69b" stroke-width="2.6" fill="none"/>
<circle cx="630" cy="312" r="19" fill="#e3f2ed" stroke="#5d9e93" stroke-width="2"/><text x="630" y="318" text-anchor="middle" font-size="18" font-weight="800" fill="#2e6462">8</text>
<circle cx="575" cy="400" r="17" fill="#eeeaf8" stroke="#9c90c0" stroke-width="2"/><text x="575" y="406" text-anchor="middle" font-size="16" font-weight="800" fill="#2e6462">2</text>
<text x="648" y="400" font-size="14" fill="#526f71" font-family="system-ui,Arial,sans-serif">孩子 2 直接接到 8 上</text>
<line x1="24" y1="470" x2="856" y2="470" stroke="#dce8e4" stroke-width="1.5"/>

<text x="24" y="510" font-size="15" font-weight="750" fill="#137976" font-family="system-ui,Arial,sans-serif">③ 两个孩子：用中序后继（右子树最小值）替换</text>
<path d="M200 536L270 570M270 606L232 640M270 606L332 640" stroke="#82a69b" stroke-width="2.6" fill="none"/>
<circle cx="200" cy="520" r="19" fill="#e3f2ed" stroke="#5d9e93" stroke-width="2"/><text x="200" y="526" text-anchor="middle" font-size="18" font-weight="800" fill="#2e6462">8</text>
<circle cx="270" cy="588" r="19" fill="#fdece8" stroke="#c8664c" stroke-width="2.4"/><text x="270" y="594" text-anchor="middle" font-size="18" font-weight="800" fill="#a63d29">3</text>
<circle cx="228" cy="646" r="16" fill="#eeeaf8" stroke="#9c90c0" stroke-width="2"/><text x="228" y="651" text-anchor="middle" font-size="15" font-weight="800" fill="#2e6462">2</text>
<circle cx="332" cy="646" r="16" fill="#fdf1cf" stroke="#c9a53f" stroke-width="2.2"/><text x="332" y="651" text-anchor="middle" font-size="15" font-weight="800" fill="#7a5f14">5</text>
<text x="410" y="590" font-size="30" fill="#8fb3ab" font-family="system-ui,Arial,sans-serif">⟶</text>
<path d="M640 536L700 570M700 606L660 640" stroke="#82a69b" stroke-width="2.6" fill="none"/>
<circle cx="640" cy="520" r="19" fill="#e3f2ed" stroke="#5d9e93" stroke-width="2"/><text x="640" y="526" text-anchor="middle" font-size="18" font-weight="800" fill="#2e6462">8</text>
<circle cx="700" cy="588" r="19" fill="#fdf1cf" stroke="#c9a53f" stroke-width="2.2"/><text x="700" y="594" text-anchor="middle" font-size="18" font-weight="800" fill="#7a5f14">5</text>
<circle cx="660" cy="646" r="16" fill="#eeeaf8" stroke="#9c90c0" stroke-width="2"/><text x="660" y="651" text-anchor="middle" font-size="15" font-weight="800" fill="#2e6462">2</text>
<text x="736" y="588" font-size="14" fill="#7a5f14" font-family="system-ui,Arial,sans-serif">后继 5 的值上移</text>
<text x="736" y="608" font-size="14" fill="#526f71" font-family="system-ui,Arial,sans-serif">再删除原 5 节点</text>
</svg>
