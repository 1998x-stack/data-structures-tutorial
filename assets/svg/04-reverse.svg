<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" role="img" aria-labelledby="t d"><title id="t">反转一步的指针状态</title><desc id="d">prev 指向 A，cur 指向 B，先保存 nxt 为 C，再将 B.next 指向 A，最后 prev 变 B 且 cur 变 C</desc><rect width="880" height="390" rx="14" fill="#f9fcf9"/>
<defs><marker id="solid" viewBox="0 0 10 10" markerWidth="7" markerHeight="7" orient="auto" refX="9" refY="5"><path d="M0 0L10 5L0 10Z" fill="#14847c"/></marker><marker id="dash" viewBox="0 0 10 10" markerWidth="7" markerHeight="7" orient="auto" refX="9" refY="5"><path d="M0 0L10 5L0 10Z" fill="#c87557"/></marker></defs>
<g font-family="system-ui,Arial,sans-serif"><text x="27" y="39" font-size="21" font-weight="750" fill="#244348">一步反转：保存旧出口，再连接新前驱</text><text x="27" y="65" font-size="13" fill="#5b7275">操作前 prev = A，cur = B，nxt = C；旧 B→C 需要被保护</text></g>
<g font-family="system-ui,Arial,sans-serif"><rect x="90" y="142" width="154" height="88" rx="12" fill="#d9f1ec" stroke="#77aaa1" stroke-width="2"/><text x="167" y="192" text-anchor="middle" fill="#315b5c" font-size="30" font-weight="800">A</text></g><g font-family="system-ui,Arial,sans-serif"><rect x="335" y="142" width="154" height="88" rx="12" fill="#f0ebfa" stroke="#9582c6" stroke-width="2"/><text x="412" y="192" text-anchor="middle" fill="#315b5c" font-size="30" font-weight="800">B</text></g><g font-family="system-ui,Arial,sans-serif"><rect x="587" y="142" width="154" height="88" rx="12" fill="#fff0e6" stroke="#77aaa1" stroke-width="2"/><text x="664" y="192" text-anchor="middle" fill="#315b5c" font-size="30" font-weight="800">C</text></g>
<g font-family="system-ui,Arial,sans-serif" font-size="15" text-anchor="middle"><text x="167" y="115" fill="#147b75" font-weight="750">prev（已反转）</text><text x="412" y="115" fill="#7461ba" font-weight="750">cur（正在处理）</text><text x="665" y="115" fill="#b36b49" font-weight="750">nxt（先保存）</text></g>
<path d="M335 183C289 254,255 253,243 187" stroke="#14847c" stroke-width="3" fill="none" marker-end="url(#solid)"/><path d="M490 182H585" stroke="#c87557" stroke-width="3" stroke-dasharray="8 7" fill="none" marker-end="url(#dash)"/>
<g font-family="system-ui,Arial,sans-serif"><text x="266" y="280" fill="#197a74" font-size="14">新：B.next = A</text><text x="490" y="131" fill="#b36b49" font-size="13">旧链接需要暂存</text><rect x="29" y="312" width="820" height="54" rx="9" fill="#e9f5f1"/><text x="47" y="334" fill="#2a6262" font-size="16" font-weight="700">结束本轮：prev = B，cur = C；未处理部分仍从 C 开始。</text><text x="47" y="355" fill="#5d7777" font-size="13">不变量：已反转的前缀 + 未处理的后缀，恰好覆盖原来的所有节点。</text></g></svg>