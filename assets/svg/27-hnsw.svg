<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-labelledby="hnsw-title hnsw-desc">
<title id="hnsw-title">HNSW 用稀疏的上层快速定位、密集的下层精确搜索</title>
<desc id="hnsw-desc">顶层节点少、连边远，先在粗粒度上快速跳到大区域；再逐层下降到密集的下层，在局部小范围内找到最近邻。</desc>
<defs><marker id="hnsw-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#2563eb"/></marker></defs>
<g font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">
<line x1="160" y1="90" x2="340" y2="90" stroke="#94a3b8"/>
<line x1="340" y1="90" x2="520" y2="90" stroke="#2563eb" stroke-width="2" marker-end="url(#hnsw-arrow)"/>
<line x1="520" y1="90" x2="700" y2="90" stroke="#94a3b8"/>
<line x1="90" y1="210" x2="190" y2="210" stroke="#94a3b8"/><line x1="190" y1="210" x2="290" y2="210" stroke="#94a3b8"/><line x1="290" y1="210" x2="390" y2="210" stroke="#94a3b8"/>
<line x1="390" y1="210" x2="490" y2="210" stroke="#94a3b8"/><line x1="490" y1="210" x2="590" y2="210" stroke="#2563eb" stroke-width="2" marker-end="url(#hnsw-arrow)"/>
<line x1="590" y1="210" x2="690" y2="210" stroke="#94a3b8"/><line x1="690" y1="210" x2="790" y2="210" stroke="#94a3b8"/>
<line x1="520" y1="106" x2="490" y2="194" stroke="#b45309" stroke-dasharray="5 4"/>
<circle cx="160" cy="90" r="14" fill="#e0e7ff" stroke="#4338ca"/><circle cx="340" cy="90" r="14" fill="#e0e7ff" stroke="#4338ca"/>
<circle cx="520" cy="90" r="14" fill="#e0e7ff" stroke="#4338ca"/><circle cx="700" cy="90" r="14" fill="#e0e7ff" stroke="#4338ca"/>
<circle cx="90" cy="210" r="14" fill="#dcfce7" stroke="#15803d"/><circle cx="190" cy="210" r="14" fill="#dcfce7" stroke="#15803d"/><circle cx="290" cy="210" r="14" fill="#dcfce7" stroke="#15803d"/>
<circle cx="390" cy="210" r="14" fill="#dcfce7" stroke="#15803d"/><circle cx="490" cy="210" r="14" fill="#fde68a" stroke="#b45309"/><circle cx="590" cy="210" r="14" fill="#dcfce7" stroke="#15803d"/>
<circle cx="690" cy="210" r="14" fill="#dcfce7" stroke="#15803d"/><circle cx="790" cy="210" r="14" fill="#dcfce7" stroke="#15803d"/>
<text x="440" y="44" fill="#312e81">上层稀疏：边跨度大，快速接近目标区域</text>
<text x="440" y="268" fill="#166534">下层密集：边跨度小，在局部精确定位最近邻</text>
<text x="740" y="150" font-size="12" fill="#b45309" text-anchor="start">逐层下降</text>
<text x="440" y="150" fill="#475569">多层图 = 跳表思想在高维空间的重现</text>
</g></svg>
