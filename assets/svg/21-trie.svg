<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" role="img" aria-labelledby="trie-title trie-desc">
<title id="trie-title">字典树把公共前缀合并成一条共享路径</title>
<desc id="trie-desc">apple、app、apply 三个词共享前缀 a-p-p，因此在树里只存一条路径；在第三个 p 处标记词尾得到 app，再分叉出 e 与 y 分别得到 apple 和 apply。</desc>
<defs><marker id="trie-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#64748b"/></marker></defs>
<g font-family="-apple-system, 'PingFang SC', sans-serif" text-anchor="middle">
<line x1="93" y1="240" x2="166" y2="240" stroke="#64748b" marker-end="url(#trie-arrow)"/>
<line x1="213" y1="240" x2="266" y2="240" stroke="#64748b" marker-end="url(#trie-arrow)"/>
<line x1="313" y1="240" x2="366" y2="240" stroke="#64748b" marker-end="url(#trie-arrow)"/>
<line x1="413" y1="240" x2="466" y2="240" stroke="#64748b" marker-end="url(#trie-arrow)"/>
<line x1="507" y1="227" x2="584" y2="172" stroke="#64748b" marker-end="url(#trie-arrow)"/>
<line x1="507" y1="253" x2="584" y2="308" stroke="#64748b" marker-end="url(#trie-arrow)"/>
<circle cx="70" cy="240" r="22" fill="#e2e8f0" stroke="#475569"/><text x="70" y="246" font-size="15" fill="#334155">根</text>
<circle cx="190" cy="240" r="22" fill="#e0e7ff" stroke="#4338ca"/><text x="190" y="246" font-size="15" fill="#312e81">a</text>
<circle cx="290" cy="240" r="22" fill="#e0e7ff" stroke="#4338ca"/><text x="290" y="246" font-size="15" fill="#312e81">p</text>
<circle cx="390" cy="240" r="22" fill="#fde68a" stroke="#b45309"/><text x="390" y="246" font-size="15" fill="#78350f">p</text>
<circle cx="490" cy="240" r="22" fill="#e0e7ff" stroke="#4338ca"/><text x="490" y="246" font-size="15" fill="#312e81">l</text>
<circle cx="610" cy="160" r="22" fill="#dcfce7" stroke="#15803d"/><text x="610" y="166" font-size="15" fill="#14532d">e</text>
<circle cx="610" cy="320" r="22" fill="#dcfce7" stroke="#15803d"/><text x="610" y="326" font-size="15" fill="#14532d">y</text>
<circle cx="610" cy="160" r="30" fill="none" stroke="#15803d" stroke-dasharray="4 3"/>
<circle cx="610" cy="320" r="30" fill="none" stroke="#15803d" stroke-dasharray="4 3"/>
<circle cx="390" cy="240" r="30" fill="none" stroke="#b45309" stroke-dasharray="4 3"/>
<text x="390" y="188" font-size="13" fill="#78350f">词尾：app</text>
<text x="660" y="120" font-size="13" fill="#14532d">词尾：apple</text>
<text x="660" y="360" font-size="13" fill="#14532d">词尾：apply</text>
<text x="290" y="300" font-size="13" fill="#4338ca">共享前缀 a-p-p 只存一次</text>
</g></svg>
