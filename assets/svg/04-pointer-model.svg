<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" role="img" aria-labelledby="t d"><title id="t">单链表以引用组织顺序</title><desc id="d">A B C 的实际位置不连续，但各节点 next 引用使其形成顺序；从 head 沿箭头访问</desc><rect width="880" height="390" rx="14" fill="#f9fcf9"/>
<defs><marker id="a" viewBox="0 0 10 10" markerWidth="7" markerHeight="7" orient="auto" refX="9" refY="5"><path d="M0 0L10 5L0 10Z" fill="#4e8e86"/></marker></defs>
<g font-family="system-ui,Arial,sans-serif"><text x="28" y="42" font-size="21" fill="#203f44" font-weight="750">逻辑顺序由 next 决定，不能按地址排序</text><text x="28" y="66" font-size="13" fill="#596f72">离散分配是可能情形；内存地址是示意标签，而非真实 CPython 堆地址</text></g>
<g font-family="system-ui,Arial,sans-serif"><rect x="30" y="168" width="108" height="54" rx="7" fill="#e2f3ee" stroke="#68a69d"/><text x="84" y="199" fill="#126967" font-size="18" text-anchor="middle" font-weight="700">head</text>
<rect x="192" y="142" width="160" height="89" rx="10" fill="#fff" stroke="#77aca4" stroke-width="2"/><rect x="298" y="142" width="54" height="89" fill="#e0f0ed" rx="4"/><text x="245" y="180" font-size="20" font-weight="750" text-anchor="middle" fill="#215d5b">A</text><text x="245" y="206" font-size="13" text-anchor="middle" fill="#64807d">value</text><text x="325" y="190" font-size="13" text-anchor="middle" fill="#176c6b">next</text><text x="272" y="129" font-size="13" text-anchor="middle" fill="#896b56">node 0x2A30</text><rect x="425" y="142" width="160" height="89" rx="10" fill="#fff" stroke="#77aca4" stroke-width="2"/><rect x="531" y="142" width="54" height="89" fill="#e0f0ed" rx="4"/><text x="478" y="180" font-size="20" font-weight="750" text-anchor="middle" fill="#215d5b">B</text><text x="478" y="206" font-size="13" text-anchor="middle" fill="#64807d">value</text><text x="558" y="190" font-size="13" text-anchor="middle" fill="#176c6b">next</text><text x="505" y="129" font-size="13" text-anchor="middle" fill="#896b56">node 0x1B20</text><rect x="660" y="142" width="160" height="89" rx="10" fill="#fff" stroke="#77aca4" stroke-width="2"/><rect x="766" y="142" width="54" height="89" fill="#e0f0ed" rx="4"/><text x="713" y="180" font-size="20" font-weight="750" text-anchor="middle" fill="#215d5b">C</text><text x="713" y="206" font-size="13" text-anchor="middle" fill="#64807d">value</text><text x="793" y="190" font-size="13" text-anchor="middle" fill="#176c6b">next</text><text x="740" y="129" font-size="13" text-anchor="middle" fill="#896b56">node 0xF0C0</text><text x="744" y="269" font-size="14" fill="#4f7272">None</text></g>
<g stroke="#4e8e86" stroke-width="2.5" fill="none" marker-end="url(#a)"><path d="M138 195H191"/><path d="M352 185H424"/><path d="M585 185H659"/><path d="M820 185V247H756V258"/></g>
<rect x="33" y="306" width="810" height="53" rx="9" fill="#eaf5f2"/><g font-family="system-ui,Arial,sans-serif"><text x="51" y="328" fill="#206c69" font-weight="700" font-size="16">访问 B：先取 head，再沿 A.next，到达 B。</text><text x="51" y="350" fill="#537574" font-size="13">时间与节点之间实际地址的远近无关，取决于需要经过多少条 next 边。</text></g></svg>