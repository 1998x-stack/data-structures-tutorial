<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" role="img" aria-labelledby="t d"><title id="t">不含重复字符的滑动窗口</title><desc id="d">字符串 abca 从左至右扫描，遇到最后一个a时旧窗口abc出现重复，左边界移动到b，从而新窗口bca无重复</desc>
<defs><marker id="wa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6c8c87"/></marker></defs>
<rect width="880" height="390" rx="15" fill="#f9fcf9"/><g font-family="system-ui,Arial,sans-serif"><text x="28" y="38" font-size="20" font-weight="700" fill="#274749">维护不变量：窗口中没有重复字符</text><text x="28" y="61" font-size="13" fill="#63797b">右边界扩大窗口；新字符冲突时，移动左边界直到不变量重新成立</text></g>
<g font-family="system-ui,Arial,sans-serif"><text x="32" y="112" font-size="15" font-weight="700" fill="#b66545">状态 A：读取第 4 个字符 a，形成重复</text>
<rect x="252" y="89" width="91" height="60" rx="8" fill="#def0eb" stroke="#4a9e97" stroke-width="1.8"/><rect x="359" y="89" width="91" height="60" rx="8" fill="#def0eb" stroke="#4a9e97" stroke-width="1.8"/><rect x="466" y="89" width="91" height="60" rx="8" fill="#def0eb" stroke="#4a9e97" stroke-width="1.8"/><rect x="573" y="89" width="91" height="60" rx="8" fill="#ffeddc" stroke="#c96e4f" stroke-width="1.8"/>
<text x="297" y="124" font-size="25" text-anchor="middle" font-weight="750" fill="#267677">a</text><text x="404" y="124" font-size="25" text-anchor="middle" font-weight="750" fill="#267677">b</text><text x="511" y="124" font-size="25" text-anchor="middle" font-weight="750" fill="#267677">c</text><text x="618" y="124" font-size="25" text-anchor="middle" font-weight="750" fill="#b66142">a</text>
<text x="252" y="169" font-size="12" fill="#667b7a">left = 0</text><text x="632" y="169" font-size="12" fill="#667b7a">right = 3</text></g><g font-family="system-ui,Arial,sans-serif"><text x="32" y="243" font-size="15" font-weight="700" fill="#197b79">状态 B：移走原先的 a，窗口变为 b c a</text>
<rect x="252" y="220" width="91" height="60" rx="8" fill="#f8f9f7" stroke="#c3d0cb" stroke-width="1.8"/><rect x="359" y="220" width="91" height="60" rx="8" fill="#def0eb" stroke="#4a9e97" stroke-width="1.8"/><rect x="466" y="220" width="91" height="60" rx="8" fill="#def0eb" stroke="#4a9e97" stroke-width="1.8"/><rect x="573" y="220" width="91" height="60" rx="8" fill="#def0eb" stroke="#4a9e97" stroke-width="1.8"/>
<text x="297" y="255" font-size="25" text-anchor="middle" font-weight="750" fill="#267677">a</text><text x="404" y="255" font-size="25" text-anchor="middle" font-weight="750" fill="#267677">b</text><text x="511" y="255" font-size="25" text-anchor="middle" font-weight="750" fill="#267677">c</text><text x="618" y="255" font-size="25" text-anchor="middle" font-weight="750" fill="#267677">a</text>
<text x="252" y="300" font-size="12" fill="#667b7a">left = 1</text><text x="632" y="300" font-size="12" fill="#667b7a">right = 3</text></g>
<path d="M690 181V212" fill="none" stroke="#6c8c87" stroke-width="2" marker-end="url(#wa)"/><g font-family="system-ui,Arial,sans-serif"><text x="34" y="375" font-size="12" fill="#617a79">窗口长度 = right − left + 1；每个字符最多被左右指针访问常数次，因此总 O(n)。</text></g></svg>