<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" role="img" aria-labelledby="t d"><title id="t">完全二叉树堆的数组表示</title><desc id="d">一个最大堆的树形与它按层序存入数组的对应关系，从 0 开始编号，父节点为 (i-1)//2，左右孩子为 2i+1 和 2i+2</desc><rect width="880" height="400" rx="14" fill="#f9fcf9"/>
<g font-family="system-ui,Arial,sans-serif"><text x="24" y="36" font-size="20" font-weight="750" fill="#234649">完全二叉树可以按层序直接放进数组</text><text x="24" y="60" font-size="13" fill="#667a7d">无需左右指针：节点下标就决定了父子关系，下标 0 为根</text></g>
<path d="M250 128L150 180M250 128L350 180M150 180L100 252M150 180L200 252M350 180L300 252M350 180L400 252" stroke="#82a69b" stroke-width="2.4" fill="none"/>
<circle cx="250" cy="110" r="21" fill="#e3f2ed" stroke="#5d9e93" stroke-width="2"/><text x="250" y="117" text-anchor="middle" font-size="18" font-weight="800" fill="#2e6462">9</text>
<circle cx="150" cy="196" r="19" fill="#eeeaf8" stroke="#9c90c0" stroke-width="2"/><text x="150" y="202" text-anchor="middle" font-size="17" font-weight="800" fill="#2e6462">7</text>
<circle cx="350" cy="196" r="19" fill="#eeeaf8" stroke="#9c90c0" stroke-width="2"/><text x="350" y="202" text-anchor="middle" font-size="17" font-weight="800" fill="#2e6462">8</text>
<circle cx="100" cy="268" r="18" fill="#fff4e9" stroke="#cfad82" stroke-width="2"/><text x="100" y="274" text-anchor="middle" font-size="16" font-weight="800" fill="#2e6462">3</text>
<circle cx="200" cy="268" r="18" fill="#fff4e9" stroke="#cfad82" stroke-width="2"/><text x="200" y="274" text-anchor="middle" font-size="16" font-weight="800" fill="#2e6462">5</text>
<circle cx="300" cy="268" r="18" fill="#fff4e9" stroke="#cfad82" stroke-width="2"/><text x="300" y="274" text-anchor="middle" font-size="16" font-weight="800" fill="#2e6462">2</text>
<circle cx="400" cy="268" r="18" fill="#fff4e9" stroke="#cfad82" stroke-width="2"/><text x="400" y="274" text-anchor="middle" font-size="16" font-weight="800" fill="#2e6462">6</text>
<g font-family="system-ui,Arial,sans-serif" font-size="13" fill="#526f71"><text x="250" y="150" text-anchor="middle">下标 0</text><text x="150" y="238" text-anchor="middle">下标 1</text><text x="350" y="238" text-anchor="middle">下标 2</text><text x="100" y="310" text-anchor="middle">下标 3</text><text x="200" y="310" text-anchor="middle">下标 4</text><text x="300" y="310" text-anchor="middle">下标 5</text><text x="400" y="310" text-anchor="middle">下标 6</text><text x="40" y="356" fill="#137976">每个节点都 ≥ 它的两个孩子；兄弟之间没有大小要求。</text></g>
<line x1="452" y1="90" x2="452" y2="360" stroke="#dce8e4" stroke-width="2" stroke-dasharray="6 7"/>
<text x="486" y="104" font-family="system-ui,Arial,sans-serif" font-size="15" font-weight="750" fill="#137976">数组表示（按层序）</text>
<g font-family="system-ui,Arial,sans-serif"><rect x="486" y="122" width="42" height="36" rx="6" fill="#e3f2ed" stroke="#5d9e93"/><text x="507" y="147" text-anchor="middle" font-size="17" font-weight="800" fill="#2e6462">9</text><rect x="532" y="122" width="42" height="36" rx="6" fill="#eeeaf8" stroke="#9c90c0"/><text x="553" y="147" text-anchor="middle" font-size="17" font-weight="800" fill="#2e6462">7</text><rect x="578" y="122" width="42" height="36" rx="6" fill="#eeeaf8" stroke="#9c90c0"/><text x="599" y="147" text-anchor="middle" font-size="17" font-weight="800" fill="#2e6462">8</text><rect x="624" y="122" width="42" height="36" rx="6" fill="#fff4e9" stroke="#cfad82"/><text x="645" y="147" text-anchor="middle" font-size="17" font-weight="800" fill="#2e6462">3</text><rect x="670" y="122" width="42" height="36" rx="6" fill="#fff4e9" stroke="#cfad82"/><text x="691" y="147" text-anchor="middle" font-size="17" font-weight="800" fill="#2e6462">5</text><rect x="716" y="122" width="42" height="36" rx="6" fill="#fff4e9" stroke="#cfad82"/><text x="737" y="147" text-anchor="middle" font-size="17" font-weight="800" fill="#2e6462">2</text><rect x="762" y="122" width="42" height="36" rx="6" fill="#fff4e9" stroke="#cfad82"/><text x="783" y="147" text-anchor="middle" font-size="17" font-weight="800" fill="#2e6462">6</text>
<text x="496" y="182" font-size="13" fill="#8a9a99">0</text><text x="542" y="182" font-size="13" fill="#8a9a99">1</text><text x="588" y="182" font-size="13" fill="#8a9a99">2</text><text x="634" y="182" font-size="13" fill="#8a9a99">3</text><text x="680" y="182" font-size="13" fill="#8a9a99">4</text><text x="726" y="182" font-size="13" fill="#8a9a99">5</text><text x="772" y="182" font-size="13" fill="#8a9a99">6</text></g>
<g font-family="system-ui,Arial,sans-serif" font-size="14" fill="#3c5658"><text x="486" y="228">parent(i) = (i − 1) // 2</text><text x="486" y="258">left(i) = 2i + 1</text><text x="486" y="288">right(i) = 2i + 2</text><text x="486" y="330" fill="#137976">例：left(1) = 3，对应值 3；</text><text x="486" y="352" fill="#137976">parent(6) = 2，对应值 8。</text><text x="486" y="382" fill="#526f71">最后一个非叶节点下标为 n//2 − 1。</text></g>
</svg>
