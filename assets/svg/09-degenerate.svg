<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" role="img" aria-labelledby="t d"><title id="t">升序插入导致的二叉搜索树退化</title><desc id="d">左侧按 1 到 5 升序插入，每次都挂在最右端，形成高度为 4 的链；右侧同样五个键平衡排列时高度仅为 2</desc><rect width="880" height="430" rx="14" fill="#f9fcf9"/>
<g font-family="system-ui,Arial,sans-serif"><text x="24" y="36" font-size="20" font-weight="750" fill="#234649">同样的 5 个键，形状不同，代价相差一个量级</text><text x="24" y="60" font-size="13" fill="#667a7d">插入顺序会决定树形；升序（或降序）输入会把每一次比较都推向同一侧</text></g>
<text x="40" y="100" font-size="15" font-weight="750" fill="#b3543f" font-family="system-ui,Arial,sans-serif">升序插入 1,2,3,4,5：退化成链</text>
<path d="M96 130L150 178M156 186L210 234M216 242L270 290M276 298L330 346" stroke="#b8998f" stroke-width="2.6" fill="none"/>
<circle cx="90" cy="116" r="19" fill="#e3f2ed" stroke="#5d9e93" stroke-width="2"/><text x="90" y="122" text-anchor="middle" font-size="18" font-weight="800" fill="#2e6462">1</text>
<circle cx="150" cy="178" r="19" fill="#eeeaf8" stroke="#9c90c0" stroke-width="2"/><text x="150" y="184" text-anchor="middle" font-size="18" font-weight="800" fill="#2e6462">2</text>
<circle cx="210" cy="240" r="19" fill="#eeeaf8" stroke="#9c90c0" stroke-width="2"/><text x="210" y="246" text-anchor="middle" font-size="18" font-weight="800" fill="#2e6462">3</text>
<circle cx="270" cy="302" r="19" fill="#eeeaf8" stroke="#9c90c0" stroke-width="2"/><text x="270" y="308" text-anchor="middle" font-size="18" font-weight="800" fill="#2e6462">4</text>
<circle cx="330" cy="364" r="19" fill="#fff4e9" stroke="#cfad82" stroke-width="2"/><text x="330" y="370" text-anchor="middle" font-size="18" font-weight="800" fill="#2e6462">5</text>
<g font-family="system-ui,Arial,sans-serif" font-size="14" fill="#8a5a4c"><text x="40" y="404">高度 = 4 条边，查找 5 需比较 5 次</text><text x="40" y="424">每个节点只有一个孩子，等价于线性表</text></g>
<line x1="440" y1="86" x2="440" y2="404" stroke="#dce8e4" stroke-width="2" stroke-dasharray="6 7"/>
<text x="464" y="100" font-size="15" font-weight="750" fill="#137976" font-family="system-ui,Arial,sans-serif">平衡排列：高度降到 2</text>
<path d="M620 156L540 244M620 156L700 244M540 260L600 330M700 260L650 330" stroke="#82a69b" stroke-width="2.6" fill="none"/>
<circle cx="620" cy="140" r="20" fill="#e3f2ed" stroke="#5d9e93" stroke-width="2"/><text x="620" y="146" text-anchor="middle" font-size="19" font-weight="800" fill="#2e6462">3</text>
<circle cx="540" cy="260" r="18" fill="#eeeaf8" stroke="#9c90c0" stroke-width="2"/><text x="540" y="266" text-anchor="middle" font-size="17" font-weight="800" fill="#2e6462">1</text>
<circle cx="700" cy="260" r="18" fill="#eeeaf8" stroke="#9c90c0" stroke-width="2"/><text x="700" y="266" text-anchor="middle" font-size="17" font-weight="800" fill="#2e6462">5</text>
<circle cx="600" cy="346" r="16" fill="#fff4e9" stroke="#cfad82" stroke-width="2"/><text x="600" y="351" text-anchor="middle" font-size="15" font-weight="800" fill="#2e6462">2</text>
<circle cx="650" cy="346" r="16" fill="#fff4e9" stroke="#cfad82" stroke-width="2"/><text x="650" y="351" text-anchor="middle" font-size="15" font-weight="800" fill="#2e6462">4</text>
<g font-family="system-ui,Arial,sans-serif" font-size="14" fill="#526f71"><text x="464" y="404" fill="#137976">高度 = 2 条边，查找最多比较 3 次</text><text x="464" y="424">平衡策略的目标：把高度压到 O(log n)</text></g>
</svg>
