<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" width="880" height="280" role="img" aria-labelledby="rl-title rl-desc">
<title id="rl-title">固定窗口与滑动窗口限流的区别</title>
<desc id="rl-desc">固定窗口在固定的时间点重置计数，窗口切换时可能叠加两波流量造成突发；滑动窗口每次只看最近一段时间内的请求，边界更平滑。</desc>
<g font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">
<line x1="80" y1="210" x2="820" y2="210" stroke="#475569"/>
<line x1="80" y1="205" x2="80" y2="215" stroke="#475569"/><line x1="260" y1="205" x2="260" y2="215" stroke="#475569"/><line x1="440" y1="205" x2="440" y2="215" stroke="#475569"/><line x1="620" y1="205" x2="620" y2="215" stroke="#475569"/><line x1="800" y1="205" x2="800" y2="215" stroke="#475569"/>
<text x="80" y="232" fill="#475569">0s</text><text x="260" y="232" fill="#475569">1s</text><text x="440" y="232" fill="#475569">2s</text><text x="620" y="232" fill="#475569">3s</text><text x="800" y="232" fill="#475569">4s</text>
<rect x="80" y="120" width="180" height="50" rx="5" fill="#e0e7ff" stroke="#4338ca"/><text x="170" y="150" fill="#312e81">固定窗口：计数 1000</text>
<rect x="260" y="120" width="180" height="50" rx="5" fill="#e0e7ff" stroke="#4338ca"/><text x="350" y="150" fill="#312e81">固定窗口：计数 1000</text>
<line x1="260" y1="100" x2="260" y2="180" stroke="#b91c1c" stroke-dasharray="5 4"/>
<text x="260" y="90" fill="#b91c1c">窗口切换瞬间可能叠加两波</text>
<rect x="330" y="242" width="180" height="26" rx="5" fill="#dcfce7" stroke="#15803d"/><text x="420" y="260" fill="#14532d">最近 1 秒（随请求滑动）</text>
<text x="420" y="108" fill="#475569">固定窗口：每个格独立计数，边界处不平滑</text>
</g></svg>
