<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" role="img" aria-labelledby="t d"><title id="t">AVL 双旋转：LR 先左后右，RL 先右后左</title><desc id="d">LR 情况先对左孩子 y 左旋，使其变为 LL 形状，再对 z 右旋；RL 情况先对右孩子 y 右旋，再对 z 左旋</desc><rect width="880" height="540" rx="14" fill="#f9fcf9"/>
<g font-family="system-ui,Arial,sans-serif"><text x="24" y="36" font-size="20" font-weight="750" fill="#234649">双旋转：一次旋转不够时，对内侧子树做两次</text><text x="24" y="60" font-size="13" fill="#667a7d">判断依据不是新键插在哪，而是失衡节点较高一侧的<strong>孩子</strong>偏向哪一側</text></g>
<text x="24" y="102" font-size="15" font-weight="750" fill="#137976" font-family="system-ui,Arial,sans-serif">① LR：新键在 z 的左孩子的右子树 → 先左旋 y，再右旋 z</text>
