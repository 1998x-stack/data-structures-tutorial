<circle cx="150" cy="183" r="17" fill="#eeeaf8" stroke="#9c90c0" stroke-width="2"/><text x="150" y="189" text-anchor="middle" font-size="16" font-weight="800" fill="#2e6462">y</text>
<circle cx="210" cy="238" r="17" fill="#fdf1cf" stroke="#c9a53f" stroke-width="2.2"/><text x="210" y="244" text-anchor="middle" font-size="16" font-weight="800" fill="#7a5f14">x</text>
<g font-size="14" font-family="system-ui,Arial,sans-serif"><rect x="277" y="172" width="36" height="22" rx="5" fill="#eef3f1" stroke="#9fb7b0"/><text x="295" y="188" text-anchor="middle" fill="#526f71">T4</text><rect x="72" y="227" width="36" height="22" rx="5" fill="#eef3f1" stroke="#9fb7b0"/><text x="90" y="243" text-anchor="middle" fill="#526f71">T1</text><rect x="147" y="282" width="36" height="22" rx="5" fill="#eef3f1" stroke="#9fb7b0"/><text x="165" y="298" text-anchor="middle" fill="#526f71">T2</text><rect x="237" y="282" width="36" height="22" rx="5" fill="#eef3f1" stroke="#9fb7b0"/><text x="255" y="298" text-anchor="middle" fill="#526f71">T3</text></g>
<text x="400" y="196" font-size="30" fill="#8fb3ab" font-family="system-ui,Arial,sans-serif">⟶</text>
