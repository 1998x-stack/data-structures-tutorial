<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" role="img" aria-labelledby="t d"><title id="t">数据结构的代价对照</title><desc id="d">比较数组、单链表、哈希表和已平衡的搜索树在不同已定义操作下的常见渐进代价</desc>
<rect width="880" height="390" rx="15" fill="#f9fcf9"/>
<g font-family="system-ui,Arial,sans-serif"><text x="28" y="38" font-size="20" fill="#203f44" font-weight="700">先明确操作，再讨论「快」</text><text x="29" y="61" font-size="13" fill="#5c7174">n：结构内元素数；键哈希操作按 O(1) 计；链表表头已知；树始终保持平衡</text></g>
<g font-family="system-ui,Arial,sans-serif" font-size="15" text-anchor="middle" font-weight="700" fill="#325e5e"><rect x="30" y="88" width="820" height="48" rx="8" fill="#e4f2ed"/><text x="140" y="118">操作</text><text x="330" y="118">动态数组</text><text x="500" y="118">单链表</text><text x="650" y="118">哈希表</text><text x="790" y="118">平衡 BST</text></g>
<rect x="30" y="139" width="820" height="46" fill="#fffdf9"/><g font-family="system-ui,Arial,sans-serif" font-size="14" text-anchor="middle" fill="#30494d"><text x="140" y="165" font-weight="700">按下标访问</text><text x="330" y="165">O(1)</text><text x="500" y="165">O(n)</text><text x="650" y="165">不适用</text><text x="790" y="165">不适用</text></g><rect x="30" y="188" width="820" height="46" fill="#f0f7f2"/><g font-family="system-ui,Arial,sans-serif" font-size="14" text-anchor="middle" fill="#30494d"><text x="140" y="214" font-weight="700">头部插入</text><text x="330" y="214">O(n)</text><text x="500" y="214">O(1)</text><text x="650" y="214">键语义</text><text x="790" y="214">取决于键</text></g><rect x="30" y="237" width="820" height="46" fill="#fffdf9"/><g font-family="system-ui,Arial,sans-serif" font-size="14" text-anchor="middle" fill="#30494d"><text x="140" y="263" font-weight="700">按键查找</text><text x="330" y="263">O(n)</text><text x="500" y="263">O(n)</text><text x="650" y="263">预期 O(1)</text><text x="790" y="263">O(log n)</text></g><rect x="30" y="286" width="820" height="46" fill="#f0f7f2"/><g font-family="system-ui,Arial,sans-serif" font-size="14" text-anchor="middle" fill="#30494d"><text x="140" y="312" font-weight="700">保持有序</text><text x="330" y="312">需维护</text><text x="500" y="312">需维护</text><text x="650" y="312">不保证</text><text x="790" y="312">按键有序</text></g>
<g font-family="system-ui,Arial,sans-serif" fill="#697c7d" font-size="12"><text x="32" y="375">注：哈希表给出合理散列与负载条件下的期望代价；扩容可能让单次操作更慢。</text></g></svg>