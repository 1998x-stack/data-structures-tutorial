<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 530" role="img" aria-labelledby="t d"><title id="t">AVL 单旋转：LL 右旋与 RR 左旋</title><desc id="d">左孩子左子树变高时对节点 z 右旋，y 上升为根；右孩子右子树变高时对 z 左旋，y 上升为根，T1 到 T4 表示四个子树</desc><rect width="880" height="530" rx="14" fill="#f9fcf9"/>
<g font-family="system-ui,Arial,sans-serif"><text x="24" y="36" font-size="20" font-weight="750" fill="#234649">单旋转：一次旋转即可恢复平衡</text><text x="24" y="60" font-size="13" fill="#667a7d">T1–T4 表示任意高度的子树；旋转只重接指针，不改变中序顺序，因而仍是二叉搜索树</text></g>
<text x="24" y="102" font-size="15" font-weight="750" fill="#137976" font-family="system-ui,Arial,sans-serif">① LL（左-左）：对 z 右旋，y 上升</text>
<path d="M210 128L150 183M210 128L295 183M150 183L90 238M150 183L210 238M90 238L45 286M90 238L135 286" stroke="#82a69b" stroke-width="2.4" fill="none"/>
<circle cx="210" cy="110" r="17" fill="#e3f2ed" stroke="#5d9e93" stroke-width="2"/><text x="210" y="116" text-anchor="middle" font-size="16" font-weight="800" fill="#2e6462">z</text>
<circle cx="150" cy="183" r="17" fill="#eeeaf8" stroke="#9c90c0" stroke-width="2"/><text x="150" y="189" text-anchor="middle" font-size="16" font-weight="800" fill="#2e6462">y</text>
<circle cx="90" cy="238" r="17" fill="#fdf1cf" stroke="#c9a53f" stroke-width="2.2"/><text x="90" y="244" text-anchor="middle" font-size="16" font-weight="800" fill="#7a5f14">x</text>
<g font-size="14" font-family="system-ui,Arial,sans-serif"><rect x="277" y="172" width="36" height="22" rx="5" fill="#eef3f1" stroke="#9fb7b0"/><text x="295" y="188" text-anchor="middle" fill="#526f71">T4</text><rect x="192" y="227" width="36" height="22" rx="5" fill="#eef3f1" stroke="#9fb7b0"/><text x="210" y="243" text-anchor="middle" fill="#526f71">T3</text><rect x="27" y="275" width="36" height="22" rx="5" fill="#eef3f1" stroke="#9fb7b0"/><text x="45" y="291" text-anchor="middle" fill="#526f71">T1</text><rect x="117" y="275" width="36" height="22" rx="5" fill="#eef3f1" stroke="#9fb7b0"/><text x="135" y="291" text-anchor="middle" fill="#526f71">T2</text></g>
<text x="400" y="196" font-size="30" fill="#8fb3ab" font-family="system-ui,Arial,sans-serif">⟶</text>
<path d="M610 128L530 183M610 128L690 183M530 183L490 238M530 183L570 238M690 183L650 238M690 183L740 238" stroke="#82a69b" stroke-width="2.4" fill="none"/>
<circle cx="610" cy="110" r="17" fill="#eeeaf8" stroke="#9c90c0" stroke-width="2"/><text x="610" y="116" text-anchor="middle" font-size="16" font-weight="800" fill="#2e6462">y</text>
<circle cx="530" cy="183" r="17" fill="#fdf1cf" stroke="#c9a53f" stroke-width="2.2"/><text x="530" y="189" text-anchor="middle" font-size="16" font-weight="800" fill="#7a5f14">x</text>
<circle cx="690" cy="183" r="17" fill="#e3f2ed" stroke="#5d9e93" stroke-width="2"/><text x="690" y="189" text-anchor="middle" font-size="16" font-weight="800" fill="#2e6462">z</text>
<g font-size="14" font-family="system-ui,Arial,sans-serif"><rect x="472" y="227" width="36" height="22" rx="5" fill="#eef3f1" stroke="#9fb7b0"/><text x="490" y="243" text-anchor="middle" fill="#526f71">T1</text><rect x="552" y="227" width="36" height="22" rx="5" fill="#eef3f1" stroke="#9fb7b0"/><text x="570" y="243" text-anchor="middle" fill="#526f71">T2</text><rect x="632" y="227" width="36" height="22" rx="5" fill="#eef3f1" stroke="#9fb7b0"/><text x="650" y="243" text-anchor="middle" fill="#526f71">T3</text><rect x="722" y="227" width="36" height="22" rx="5" fill="#eef3f1" stroke="#9fb7b0"/><text x="740" y="243" text-anchor="middle" fill="#526f71">T4</text></g>
<text x="24" y="332" font-size="15" font-weight="750" fill="#137976" font-family="system-ui,Arial,sans-serif">② RR（右-右）：对 z 左旋，y 上升</text>
<path d="M210 358L270 413M210 358L125 413M270 413L330 468M270 413L210 468M330 468L290 512M330 468L370 512" stroke="#82a69b" stroke-width="2.4" fill="none"/>
<circle cx="210" cy="340" r="17" fill="#e3f2ed" stroke="#5d9e93" stroke-width="2"/><text x="210" y="346" text-anchor="middle" font-size="16" font-weight="800" fill="#2e6462">z</text>
<circle cx="270" cy="413" r="17" fill="#eeeaf8" stroke="#9c90c0" stroke-width="2"/><text x="270" y="419" text-anchor="middle" font-size="16" font-weight="800" fill="#2e6462">y</text>
<circle cx="330" cy="468" r="17" fill="#fdf1cf" stroke="#c9a53f" stroke-width="2.2"/><text x="330" y="474" text-anchor="middle" font-size="16" font-weight="800" fill="#7a5f14">x</text>
<g font-size="14" font-family="system-ui,Arial,sans-serif"><rect x="107" y="402" width="36" height="22" rx="5" fill="#eef3f1" stroke="#9fb7b0"/><text x="125" y="418" text-anchor="middle" fill="#526f71">T1</text><rect x="192" y="457" width="36" height="22" rx="5" fill="#eef3f1" stroke="#9fb7b0"/><text x="210" y="473" text-anchor="middle" fill="#526f71">T2</text><rect x="272" y="501" width="36" height="22" rx="5" fill="#eef3f1" stroke="#9fb7b0"/><text x="290" y="517" text-anchor="middle" fill="#526f71">T3</text><rect x="352" y="501" width="36" height="22" rx="5" fill="#eef3f1" stroke="#9fb7b0"/><text x="370" y="517" text-anchor="middle" fill="#526f71">T4</text></g>
<text x="400" y="426" font-size="30" fill="#8fb3ab" font-family="system-ui,Arial,sans-serif">⟶</text>
<path d="M610 358L530 413M610 358L690 413M530 413L490 468M530 413L570 468M690 413L650 468M690 413L740 468" stroke="#82a69b" stroke-width="2.4" fill="none"/>
<circle cx="610" cy="340" r="17" fill="#eeeaf8" stroke="#9c90c0" stroke-width="2"/><text x="610" y="346" text-anchor="middle" font-size="16" font-weight="800" fill="#2e6462">y</text>
<circle cx="530" cy="413" r="17" fill="#e3f2ed" stroke="#5d9e93" stroke-width="2"/><text x="530" y="419" text-anchor="middle" font-size="16" font-weight="800" fill="#2e6462">z</text>
<circle cx="690" cy="413" r="17" fill="#fdf1cf" stroke="#c9a53f" stroke-width="2.2"/><text x="690" y="419" text-anchor="middle" font-size="16" font-weight="800" fill="#7a5f14">x</text>
<g font-size="14" font-family="system-ui,Arial,sans-serif"><rect x="472" y="457" width="36" height="22" rx="5" fill="#eef3f1" stroke="#9fb7b0"/><text x="490" y="473" text-anchor="middle" fill="#526f71">T1</text><rect x="552" y="457" width="36" height="22" rx="5" fill="#eef3f1" stroke="#9fb7b0"/><text x="570" y="473" text-anchor="middle" fill="#526f71">T2</text><rect x="632" y="457" width="36" height="22" rx="5" fill="#eef3f1" stroke="#9fb7b0"/><text x="650" y="473" text-anchor="middle" fill="#526f71">T3</text><rect x="722" y="457" width="36" height="22" rx="5" fill="#eef3f1" stroke="#9fb7b0"/><text x="740" y="473" text-anchor="middle" fill="#526f71">T4</text></g>
</svg>
