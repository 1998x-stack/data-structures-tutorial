<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" role="img" aria-labelledby="t d"><title id="t">容量翻倍的动态数组扩容过程</title><desc id="d">演示容量从1到2到4到8时，元素复制次数依次是1、2、4；普通追加无需复制旧元素</desc>
<defs><marker id="ap" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#608b85"/></marker></defs>
<rect width="880" height="390" rx="15" fill="#f9fcf9"/><g font-family="system-ui,Arial,sans-serif"><text x="29" y="38" font-size="20" font-weight="700" fill="#213f42">为什么一次 O(n) 扩容，不妨碍均摊 O(1) 追加？</text><text x="29" y="61" font-size="13" fill="#667b78">示意模型：容量每次翻倍；不是 CPython list 的精确扩容策略</text></g>
<g font-family="system-ui,Arial,sans-serif"><text x="43" y="110" font-size="16" font-weight="750" fill="#255856">容量 1</text><text x="43" y="135" font-size="13" fill="#657a7b">旧元素复制 0 次</text><rect x="44" y="170" width="33" height="36" rx="3" fill="#f5dcca" stroke="#c96e4f"/><text x="43" y="231" font-size="12" fill="#607778">1 个连续槽位</text></g><path d="M190 277 H242" fill="none" stroke="#608b85" stroke-width="2" marker-end="url(#ap)"/><g font-family="system-ui,Arial,sans-serif"><text x="256" y="110" font-size="16" font-weight="750" fill="#255856">容量 2</text><text x="256" y="135" font-size="13" fill="#657a7b">旧元素复制 1 次</text><rect x="257" y="170" width="33" height="36" rx="3" fill="#d8eeea" stroke="#4f9b92"/><rect x="292" y="170" width="33" height="36" rx="3" fill="#f5dcca" stroke="#c96e4f"/><text x="256" y="231" font-size="12" fill="#607778">2 个连续槽位</text></g><path d="M403 277 H455" fill="none" stroke="#608b85" stroke-width="2" marker-end="url(#ap)"/><g font-family="system-ui,Arial,sans-serif"><text x="469" y="110" font-size="16" font-weight="750" fill="#255856">容量 4</text><text x="469" y="135" font-size="13" fill="#657a7b">旧元素复制 2 次</text><rect x="470" y="170" width="33" height="36" rx="3" fill="#d8eeea" stroke="#4f9b92"/><rect x="505" y="170" width="33" height="36" rx="3" fill="#d8eeea" stroke="#4f9b92"/><rect x="540" y="170" width="33" height="36" rx="3" fill="#d8eeea" stroke="#4f9b92"/><rect x="575" y="170" width="33" height="36" rx="3" fill="#f5dcca" stroke="#c96e4f"/><text x="469" y="231" font-size="12" fill="#607778">4 个连续槽位</text></g><path d="M616 277 H668" fill="none" stroke="#608b85" stroke-width="2" marker-end="url(#ap)"/><g font-family="system-ui,Arial,sans-serif"><text x="682" y="110" font-size="16" font-weight="750" fill="#255856">容量 8</text><text x="682" y="135" font-size="13" fill="#657a7b">旧元素复制 4 次</text><rect x="683" y="170" width="19.25" height="36" rx="3" fill="#d8eeea" stroke="#4f9b92"/><rect x="704.25" y="170" width="19.25" height="36" rx="3" fill="#d8eeea" stroke="#4f9b92"/><rect x="725.5" y="170" width="19.25" height="36" rx="3" fill="#d8eeea" stroke="#4f9b92"/><rect x="746.75" y="170" width="19.25" height="36" rx="3" fill="#d8eeea" stroke="#4f9b92"/><rect x="768" y="170" width="19.25" height="36" rx="3" fill="#d8eeea" stroke="#4f9b92"/><rect x="789.25" y="170" width="19.25" height="36" rx="3" fill="#d8eeea" stroke="#4f9b92"/><rect x="810.5" y="170" width="19.25" height="36" rx="3" fill="#d8eeea" stroke="#4f9b92"/><rect x="831.75" y="170" width="19.25" height="36" rx="3" fill="#f5dcca" stroke="#c96e4f"/><text x="682" y="231" font-size="12" fill="#607778">8 个连续槽位</text></g>
<rect x="34" y="297" width="811" height="64" rx="9" fill="#e8f3f0"/><g font-family="system-ui,Arial,sans-serif" fill="#265c5c"><text x="53" y="323" font-size="16" font-weight="750">前 8 次 append：复制旧元素总量 = 1 + 2 + 4 = 7</text><text x="53" y="346" font-size="13">对于翻倍模型，累计旧元素复制小于 2n，所以 n 次追加总时间 O(n)。</text></g></svg>