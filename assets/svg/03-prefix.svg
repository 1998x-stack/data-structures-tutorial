<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" role="img" aria-labelledby="t d"><title id="t">前缀和的左右边界</title><desc id="d">数组值为2、-1、4、3、-2、5，前缀和为0、2、1、5、8、6、11，区间[1,4)求和等于P4减P1等于6</desc>
<rect width="880" height="390" rx="15" fill="#f9fcf9"/><g font-family="system-ui,Arial,sans-serif"><text x="28" y="37" font-size="20" fill="#27484a" font-weight="700">用两次前缀查表，消去区间左侧的历史</text><text x="28" y="59" font-size="13" fill="#607576">左闭右开 [1,4)：包含 a[1]、a[2]、a[3]，不包含 a[4]</text></g>
<g font-family="system-ui,Arial,sans-serif" fill="#617778" font-size="15"><text x="38" y="133">数组 a</text><text x="38" y="232">前缀 P</text></g>
<g font-family="system-ui,Arial,sans-serif"><rect x="167" y="103" width="93" height="61" rx="7" fill="#fafdf9" stroke="#b8cbc4" stroke-width="1"/><text x="213" y="139" fill="#1f5b5d" font-size="23" text-anchor="middle" font-weight="700">2</text><text x="213" y="181" text-anchor="middle" fill="#657b78" font-size="12">a[0]</text></g><g font-family="system-ui,Arial,sans-serif"><rect x="272" y="103" width="93" height="61" rx="7" fill="#dcefeb" stroke="#14817e" stroke-width="2"/><text x="318" y="139" fill="#1f5b5d" font-size="23" text-anchor="middle" font-weight="700">-1</text><text x="318" y="181" text-anchor="middle" fill="#657b78" font-size="12">a[1]</text></g><g font-family="system-ui,Arial,sans-serif"><rect x="377" y="103" width="93" height="61" rx="7" fill="#dcefeb" stroke="#14817e" stroke-width="2"/><text x="423" y="139" fill="#1f5b5d" font-size="23" text-anchor="middle" font-weight="700">4</text><text x="423" y="181" text-anchor="middle" fill="#657b78" font-size="12">a[2]</text></g><g font-family="system-ui,Arial,sans-serif"><rect x="482" y="103" width="93" height="61" rx="7" fill="#dcefeb" stroke="#14817e" stroke-width="2"/><text x="528" y="139" fill="#1f5b5d" font-size="23" text-anchor="middle" font-weight="700">3</text><text x="528" y="181" text-anchor="middle" fill="#657b78" font-size="12">a[3]</text></g><g font-family="system-ui,Arial,sans-serif"><rect x="587" y="103" width="93" height="61" rx="7" fill="#fafdf9" stroke="#b8cbc4" stroke-width="1"/><text x="633" y="139" fill="#1f5b5d" font-size="23" text-anchor="middle" font-weight="700">-2</text><text x="633" y="181" text-anchor="middle" fill="#657b78" font-size="12">a[4]</text></g><g font-family="system-ui,Arial,sans-serif"><rect x="692" y="103" width="93" height="61" rx="7" fill="#fafdf9" stroke="#b8cbc4" stroke-width="1"/><text x="738" y="139" fill="#1f5b5d" font-size="23" text-anchor="middle" font-weight="700">5</text><text x="738" y="181" text-anchor="middle" fill="#657b78" font-size="12">a[5]</text></g>
<g font-family="system-ui,Arial,sans-serif"><rect x="137" y="203" width="91" height="55" rx="7" fill="#f0f6f2" stroke="#c7d9d2" stroke-width="1"/><text x="182" y="237" fill="#376465" font-size="21" text-anchor="middle" font-weight="700">0</text><text x="182" y="276" fill="#6b7977" font-size="12" text-anchor="middle">P[0]</text></g><g font-family="system-ui,Arial,sans-serif"><rect x="242" y="203" width="91" height="55" rx="7" fill="#fff0e6" stroke="#ca7a56" stroke-width="2"/><text x="287" y="237" fill="#a65d36" font-size="21" text-anchor="middle" font-weight="700">2</text><text x="287" y="276" fill="#6b7977" font-size="12" text-anchor="middle">P[1]</text></g><g font-family="system-ui,Arial,sans-serif"><rect x="347" y="203" width="91" height="55" rx="7" fill="#f0f6f2" stroke="#c7d9d2" stroke-width="1"/><text x="392" y="237" fill="#376465" font-size="21" text-anchor="middle" font-weight="700">1</text><text x="392" y="276" fill="#6b7977" font-size="12" text-anchor="middle">P[2]</text></g><g font-family="system-ui,Arial,sans-serif"><rect x="452" y="203" width="91" height="55" rx="7" fill="#f0f6f2" stroke="#c7d9d2" stroke-width="1"/><text x="497" y="237" fill="#376465" font-size="21" text-anchor="middle" font-weight="700">5</text><text x="497" y="276" fill="#6b7977" font-size="12" text-anchor="middle">P[3]</text></g><g font-family="system-ui,Arial,sans-serif"><rect x="557" y="203" width="91" height="55" rx="7" fill="#fff0e6" stroke="#ca7a56" stroke-width="2"/><text x="602" y="237" fill="#a65d36" font-size="21" text-anchor="middle" font-weight="700">8</text><text x="602" y="276" fill="#6b7977" font-size="12" text-anchor="middle">P[4]</text></g><g font-family="system-ui,Arial,sans-serif"><rect x="662" y="203" width="91" height="55" rx="7" fill="#f0f6f2" stroke="#c7d9d2" stroke-width="1"/><text x="707" y="237" fill="#376465" font-size="21" text-anchor="middle" font-weight="700">6</text><text x="707" y="276" fill="#6b7977" font-size="12" text-anchor="middle">P[5]</text></g><g font-family="system-ui,Arial,sans-serif"><rect x="767" y="203" width="91" height="55" rx="7" fill="#f0f6f2" stroke="#c7d9d2" stroke-width="1"/><text x="812" y="237" fill="#376465" font-size="21" text-anchor="middle" font-weight="700">11</text><text x="812" y="276" fill="#6b7977" font-size="12" text-anchor="middle">P[6]</text></g>
<rect x="137" y="308" width="620" height="55" rx="9" fill="#e9f5f1"/><g font-family="system-ui,Arial,sans-serif" fill="#216565" text-anchor="middle"><text x="447" y="331" font-size="17" font-weight="750">sum(a[1:4]) = P[4] − P[1] = 8 − 2 = 6</text><text x="447" y="350" font-size="12">P[k] = a[0] + ··· + a[k−1]，且 P[0] = 0</text></g></svg>