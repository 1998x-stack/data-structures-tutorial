<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" role="img" aria-labelledby="layout-title layout-desc">
<title id="layout-title">数组是连续内存，链表节点分散在堆上</title>
<desc id="layout-desc">数组元素在内存中相邻排列，一次缓存行加载能带进多个元素；链表每个节点单独分配，地址不连续，每次跳转都可能缓存未命中。</desc>
<defs><marker id="lay-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#475569"/></marker></defs>
<g font-family="-apple-system, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">
<text x="40" y="88" fill="#14532d" text-anchor="start">数组（连续）</text>
<rect x="80" y="62" width="70" height="42" rx="4" fill="#dcfce7" stroke="#15803d"/><text x="115" y="89" fill="#14532d">1</text>
<rect x="150" y="62" width="70" height="42" rx="4" fill="#dcfce7" stroke="#15803d"/><text x="185" y="89" fill="#14532d">2</text>
<rect x="220" y="62" width="70" height="42" rx="4" fill="#dcfce7" stroke="#15803d"/><text x="255" y="89" fill="#14532d">3</text>
<rect x="290" y="62" width="70" height="42" rx="4" fill="#dcfce7" stroke="#15803d"/><text x="325" y="89" fill="#14532d">4</text>
<rect x="360" y="62" width="70" height="42" rx="4" fill="#dcfce7" stroke="#15803d"/><text x="395" y="89" fill="#14532d">5</text>
<rect x="430" y="62" width="70" height="42" rx="4" fill="#dcfce7" stroke="#15803d"/><text x="465" y="89" fill="#14532d">6</text>
<rect x="500" y="62" width="70" height="42" rx="4" fill="#dcfce7" stroke="#15803d"/><text x="535" y="89" fill="#14532d">7</text>
<rect x="570" y="62" width="70" height="42" rx="4" fill="#dcfce7" stroke="#15803d"/><text x="605" y="89" fill="#14532d">8</text>
<line x1="80" y1="120" x2="640" y2="120" stroke="#15803d"/>
<line x1="80" y1="120" x2="80" y2="128" stroke="#15803d"/><line x1="640" y1="120" x2="640" y2="128" stroke="#15803d"/>
<text x="360" y="146" font-size="13" fill="#166534">相邻元素同在一段内存：一次加载可带入多个元素</text>
<text x="40" y="248" fill="#78350f" text-anchor="start">链表（分散）</text>
<rect x="120" y="222" width="130" height="46" rx="6" fill="#ffedd5" stroke="#b45309"/><text x="185" y="250" fill="#78350f">节点 1</text>
<rect x="330" y="222" width="130" height="46" rx="6" fill="#ffedd5" stroke="#b45309"/><text x="395" y="250" fill="#78350f">节点 2</text>
<rect x="540" y="222" width="130" height="46" rx="6" fill="#ffedd5" stroke="#b45309"/><text x="605" y="250" fill="#78350f">节点 3</text>
<rect x="700" y="222" width="130" height="46" rx="6" fill="#ffedd5" stroke="#b45309"/><text x="765" y="250" fill="#78350f">节点 4</text>
<line x1="250" y1="245" x2="326" y2="245" stroke="#475569" marker-end="url(#lay-arrow)"/>
<line x1="460" y1="245" x2="536" y2="245" stroke="#475569" marker-end="url(#lay-arrow)"/>
<line x1="670" y1="245" x2="696" y2="245" stroke="#475569" marker-end="url(#lay-arrow)"/>
<text x="185" y="296" font-size="13" fill="#78350f">每个节点单独分配</text>
<text x="605" y="296" font-size="13" fill="#78350f">地址不连续，每次跳转都可能缓存未命中</text>
</g></svg>
