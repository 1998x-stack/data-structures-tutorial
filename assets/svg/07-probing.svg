<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" role="img" aria-labelledby="t d"><title id="t">开放寻址线性探测冲突</title><desc id="d">12 的初始桶2为自身位置，17 的目标2被占用后进入槽3，22 占用槽4</desc><rect width="880" height="390" rx="14" fill="#f9fcf9"/>
<defs><marker id="a" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b4785c"/></marker></defs><g font-family="system-ui,Arial,sans-serif"><text x="28" y="40" font-size="21" fill="#27484b" font-weight="750">开放寻址：桶冲突后，按探测序列寻找空槽</text><text x="28" y="64" font-size="13" fill="#687b7e">线性探测教学示例：目标槽2，下一候选3，再下一个4</text></g>
<g font-family="system-ui,Arial,sans-serif"><rect x="48" y="151" width="139" height="90" rx="10" fill="#f4f8f5" stroke="#c4d4cb" stroke-width="2"/><text x="118" y="185" font-size="13" text-anchor="middle" fill="#687e7c">slot 0</text><text x="118" y="218" font-size="26" text-anchor="middle" font-weight="800" fill="#a3b4aa">空</text></g><g font-family="system-ui,Arial,sans-serif"><rect x="205" y="151" width="139" height="90" rx="10" fill="#f4f8f5" stroke="#c4d4cb" stroke-width="2"/><text x="275" y="185" font-size="13" text-anchor="middle" fill="#687e7c">slot 1</text><text x="275" y="218" font-size="26" text-anchor="middle" font-weight="800" fill="#a3b4aa">空</text></g><g font-family="system-ui,Arial,sans-serif"><rect x="362" y="151" width="139" height="90" rx="10" fill="#f1eaf8" stroke="#a091c7" stroke-width="2"/><text x="432" y="185" font-size="13" text-anchor="middle" fill="#687e7c">slot 2</text><text x="432" y="218" font-size="26" text-anchor="middle" font-weight="800" fill="#6d589a">12</text></g><g font-family="system-ui,Arial,sans-serif"><rect x="519" y="151" width="139" height="90" rx="10" fill="#f1eaf8" stroke="#a091c7" stroke-width="2"/><text x="589" y="185" font-size="13" text-anchor="middle" fill="#687e7c">slot 3</text><text x="589" y="218" font-size="26" text-anchor="middle" font-weight="800" fill="#6d589a">17</text></g><g font-family="system-ui,Arial,sans-serif"><rect x="676" y="151" width="139" height="90" rx="10" fill="#f1eaf8" stroke="#a091c7" stroke-width="2"/><text x="746" y="185" font-size="13" text-anchor="middle" fill="#687e7c">slot 4</text><text x="746" y="218" font-size="26" text-anchor="middle" font-weight="800" fill="#6d589a">22</text></g>
<g fill="none" stroke="#b4785c" stroke-width="2.6" marker-end="url(#a)"><path d="M570 126H645"/><path d="M727 126H789"/></g><g font-family="system-ui,Arial,sans-serif"><text x="430" y="117" font-size="14" fill="#a25f45">12 → 2</text><text x="588" y="117" font-size="14" fill="#a25f45">17 → 3</text><text x="748" y="117" font-size="14" fill="#a25f45">22 → 4</text></g>
<rect x="45" y="277" width="780" height="65" rx="9" fill="#e9f3ef"/><g font-family="system-ui,Arial,sans-serif"><text x="61" y="304" fill="#2f6764" font-size="16" font-weight="750">占用 3 / 5 个槽，α = 0.6</text><text x="61" y="330" fill="#64817a" font-size="13">负载升高会延长探测链；删除元素后仍需保留搜索可达性（如 tombstone）。</text></g></svg>