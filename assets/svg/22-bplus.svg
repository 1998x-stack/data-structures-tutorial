<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" role="img" aria-labelledby="bp-title bp-desc">
<title id="bp-title">B+ 树内部节点只做路标，数据都在叶子并互相连接</title>
<desc id="bp-desc">根内部节点保存分隔键 17 与 35，指向三个叶子；所有实际数据都在同一深度的叶子节点中，叶子之间用链表相连以支持范围查询。</desc>
<defs><marker id="bp-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#475569"/></marker></defs>
<g font-family="-apple-system, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">
<line x1="390" y1="100" x2="180" y2="208" stroke="#475569" marker-end="url(#bp-arrow)"/>
<line x1="440" y1="100" x2="440" y2="208" stroke="#475569" marker-end="url(#bp-arrow)"/>
<line x1="490" y1="100" x2="700" y2="208" stroke="#475569" marker-end="url(#bp-arrow)"/>
<line x1="262" y1="240" x2="356" y2="240" stroke="#15803d" marker-end="url(#bp-arrow)"/>
<line x1="522" y1="240" x2="616" y2="240" stroke="#15803d" marker-end="url(#bp-arrow)"/>
<rect x="350" y="60" width="180" height="40" rx="6" fill="#e0e7ff" stroke="#4338ca"/>
<line x1="440" y1="60" x2="440" y2="100" stroke="#4338ca"/>
<text x="395" y="85" fill="#312e81">17</text><text x="485" y="85" fill="#312e81">35</text>
<rect x="100" y="220" width="160" height="40" rx="6" fill="#dcfce7" stroke="#15803d"/>
<line x1="180" y1="220" x2="180" y2="260" stroke="#15803d"/>
<text x="140" y="245" fill="#14532d">5</text><text x="220" y="245" fill="#14532d">11</text>
<rect x="360" y="220" width="160" height="40" rx="6" fill="#dcfce7" stroke="#15803d"/>
<line x1="440" y1="220" x2="440" y2="260" stroke="#15803d"/>
<text x="400" y="245" fill="#14532d">20</text><text x="480" y="245" fill="#14532d">28</text>
<rect x="620" y="220" width="160" height="40" rx="6" fill="#dcfce7" stroke="#15803d"/>
<line x1="700" y1="220" x2="700" y2="260" stroke="#15803d"/>
<text x="660" y="245" fill="#14532d">40</text><text x="740" y="245" fill="#14532d">50</text>
<text x="440" y="40" font-size="13" fill="#312e81">内部节点只存分隔键（路标），不存数据</text>
<text x="440" y="300" font-size="13" fill="#15803d">叶子节点存实际数据，且在同一层、用链表相连</text>
<text x="440" y="322" font-size="13" fill="#475569">分隔键 17 表示：左子树小于 17，中间子树在 17 与 35 之间</text>
</g></svg>
