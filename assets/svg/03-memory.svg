<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" role="img" aria-labelledby="t d"><title id="t">定长数组与 Python 列表的不同内存模型</title><desc id="d">上半部显示 C 风格定长数值数组连续存储元素本身，下半部显示 Python list 连续存储对象引用，整数对象位于别处</desc>
<defs><marker id="mem-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#61847d"/></marker></defs><rect width="880" height="390" rx="15" fill="#f9fcf9"/>
<g font-family="system-ui,Arial,sans-serif"><text x="26" y="35" font-size="20" font-weight="700" fill="#254346">下标访问快，意味着元素一定紧挨着吗？</text><text x="26" y="58" font-size="13" fill="#617779">必须区分「连续的值」与「连续的引用」</text><text x="30" y="102" font-size="16" font-weight="750" fill="#157f7f">C 风格数组：连续的固定宽度值</text><text x="30" y="124" font-size="13" fill="#536d70">int32 例子：base + i × 4 字节</text></g>
<g font-family="system-ui,Arial,sans-serif"><rect x="343" y="83" width="114" height="61" rx="7" fill="#dbf0eb" stroke="#5aa49e"/><text x="400" y="111" font-size="19" font-weight="750" text-anchor="middle" fill="#1b6566">10</text><text x="400" y="130" font-size="11" text-anchor="middle" fill="#477575">0x3E8</text></g><g font-family="system-ui,Arial,sans-serif"><rect x="468" y="83" width="114" height="61" rx="7" fill="#dbf0eb" stroke="#5aa49e"/><text x="525" y="111" font-size="19" font-weight="750" text-anchor="middle" fill="#1b6566">20</text><text x="525" y="130" font-size="11" text-anchor="middle" fill="#477575">0x3EC</text></g><g font-family="system-ui,Arial,sans-serif"><rect x="593" y="83" width="114" height="61" rx="7" fill="#dbf0eb" stroke="#5aa49e"/><text x="650" y="111" font-size="19" font-weight="750" text-anchor="middle" fill="#1b6566">30</text><text x="650" y="130" font-size="11" text-anchor="middle" fill="#477575">0x3F0</text></g><g font-family="system-ui,Arial,sans-serif"><rect x="718" y="83" width="114" height="61" rx="7" fill="#dbf0eb" stroke="#5aa49e"/><text x="775" y="111" font-size="19" font-weight="750" text-anchor="middle" fill="#1b6566">40</text><text x="775" y="130" font-size="11" text-anchor="middle" fill="#477575">0x3F4</text></g>
<path d="M26 179H854" stroke="#dce8e2"/><g font-family="system-ui,Arial,sans-serif"><text x="30" y="218" font-size="16" font-weight="750" fill="#7461ba">CPython list：连续槽位保存对象引用</text><text x="30" y="240" font-size="13" fill="#536d70">对象可位于其他内存位置</text></g>
<g font-family="system-ui,Arial,sans-serif"><rect x="341" y="192" width="113" height="49" rx="7" fill="#efebfa" stroke="#a091c8"/><text x="397" y="222" font-size="14" text-anchor="middle" fill="#6d5a9a">ref 0</text><path d="M397 241V284" stroke="#8d80ad" stroke-width="2" marker-end="url(#mem-a)"/><rect x="352" y="284" width="90" height="49" rx="8" fill="#fff1e6" stroke="#d3a078"/><text x="397" y="314" font-size="17" font-weight="750" text-anchor="middle" fill="#a76343">10</text></g><g font-family="system-ui,Arial,sans-serif"><rect x="466" y="192" width="113" height="49" rx="7" fill="#efebfa" stroke="#a091c8"/><text x="522" y="222" font-size="14" text-anchor="middle" fill="#6d5a9a">ref 1</text><path d="M522 241V284" stroke="#8d80ad" stroke-width="2" marker-end="url(#mem-a)"/><rect x="477" y="284" width="90" height="49" rx="8" fill="#fff1e6" stroke="#d3a078"/><text x="522" y="314" font-size="17" font-weight="750" text-anchor="middle" fill="#a76343">20</text></g><g font-family="system-ui,Arial,sans-serif"><rect x="591" y="192" width="113" height="49" rx="7" fill="#efebfa" stroke="#a091c8"/><text x="647" y="222" font-size="14" text-anchor="middle" fill="#6d5a9a">ref 2</text><path d="M647 241V284" stroke="#8d80ad" stroke-width="2" marker-end="url(#mem-a)"/><rect x="602" y="284" width="90" height="49" rx="8" fill="#fff1e6" stroke="#d3a078"/><text x="647" y="314" font-size="17" font-weight="750" text-anchor="middle" fill="#a76343">30</text></g><g font-family="system-ui,Arial,sans-serif"><rect x="716" y="192" width="113" height="49" rx="7" fill="#efebfa" stroke="#a091c8"/><text x="772" y="222" font-size="14" text-anchor="middle" fill="#6d5a9a">ref 3</text><path d="M772 241V284" stroke="#8d80ad" stroke-width="2" marker-end="url(#mem-a)"/><rect x="727" y="284" width="90" height="49" rx="8" fill="#fff1e6" stroke="#d3a078"/><text x="772" y="314" font-size="17" font-weight="750" text-anchor="middle" fill="#a76343">40</text></g>
<g font-family="system-ui,Arial,sans-serif"><text x="30" y="370" font-size="12" fill="#687d7c">两种结构都能按偏移量得到槽位；Python 对象本身并不由此保证连续存储。</text></g></svg>