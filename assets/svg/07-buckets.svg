<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" role="img" aria-labelledby="t d"><title id="t">拉链法处理桶内碰撞</title><desc id="d">键12、17、22模5均为2，都放入桶2的冲突链，其他桶保持空</desc><rect width="880" height="390" rx="14" fill="#f9fcf9"/>
<defs><marker id="a" viewBox="0 0 10 10" markerWidth="7" markerHeight="7" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#5d9189"/></marker></defs>
<g font-family="system-ui,Arial,sans-serif"><text x="29" y="40" font-size="21" font-weight="750" fill="#23454a">h(k) = k mod 5，三个不同键落在同一桶</text><text x="29" y="64" font-size="13" fill="#607a7b">桶索引只是候选位置，必须比较完整键 12、17、22</text></g>
<g font-family="system-ui,Arial,sans-serif"><rect x="115" y="97" width="108" height="47" rx="7" fill="#f2f7f4" stroke="#c4d5cc"/><text x="169" y="126" text-anchor="middle" font-size="17" fill="#2c6764" font-weight="750">桶 0</text></g><g font-family="system-ui,Arial,sans-serif"><rect x="115" y="152" width="108" height="47" rx="7" fill="#f2f7f4" stroke="#c4d5cc"/><text x="169" y="181" text-anchor="middle" font-size="17" fill="#2c6764" font-weight="750">桶 1</text></g><g font-family="system-ui,Arial,sans-serif"><rect x="115" y="207" width="108" height="47" rx="7" fill="#d9efea" stroke="#5aa397"/><text x="169" y="236" text-anchor="middle" font-size="17" fill="#2c6764" font-weight="750">桶 2</text></g><g font-family="system-ui,Arial,sans-serif"><rect x="115" y="262" width="108" height="47" rx="7" fill="#f2f7f4" stroke="#c4d5cc"/><text x="169" y="291" text-anchor="middle" font-size="17" fill="#2c6764" font-weight="750">桶 3</text></g><g font-family="system-ui,Arial,sans-serif"><rect x="115" y="317" width="108" height="47" rx="7" fill="#f2f7f4" stroke="#c4d5cc"/><text x="169" y="346" text-anchor="middle" font-size="17" fill="#2c6764" font-weight="750">桶 4</text></g>
<g font-family="system-ui,Arial,sans-serif" fill="#dff0ec" stroke="#5f9e94" stroke-width="2"><rect x="323" y="206" width="112" height="54" rx="9"/><rect x="492" y="206" width="112" height="54" rx="9"/><rect x="662" y="206" width="112" height="54" rx="9"/></g><g font-family="system-ui,Arial,sans-serif" font-size="20" text-anchor="middle" fill="#1b6563" font-weight="800"><text x="379" y="241">12</text><text x="548" y="241">17</text><text x="718" y="241">22</text></g><g stroke="#5d9189" stroke-width="2.5" fill="none" marker-end="url(#a)"><path d="M223 231H321"/><path d="M435 231H490"/><path d="M604 231H660"/></g>
<g font-family="system-ui,Arial,sans-serif" font-size="13" fill="#6b817c"><text x="323" y="286">逐项比较键，不能只比较散列值</text><text x="32" y="373">例子是教学用散列；实际字典不保证这种桶结构，也不保证每次查找严格常数时间。</text></g></svg>