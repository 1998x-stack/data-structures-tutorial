<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" aria-labelledby="t d" role="img"><title id="t">每日温度中的单调栈</title><desc id="d">扫描温度 72 时，将仍留在栈中的 69 和 71 依次弹出，而 75 保留</desc><rect width="880" height="390" rx="14" fill="#f9fcf9"/>
<defs><marker id="a" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6b9189"/></marker></defs>
<g font-family="system-ui,Arial,sans-serif"><text x="26" y="41" font-size="20" font-weight="750" fill="#25464a">扫描到 72：哪些旧位置首次遇到更高温？</text><text x="26" y="64" font-size="13" fill="#60777a">栈保存下标而非温度；比较每个下标对应的数组值</text></g>
<g font-family="system-ui,Arial,sans-serif"><rect x="83" y="138" width="138" height="100" rx="10" fill="#e6f4f0" stroke="#6ca59b" stroke-width="2"/><text x="152" y="179" font-size="29" text-anchor="middle" font-weight="750" fill="#2f6565">75°</text><text x="152" y="216" text-anchor="middle" fill="#536d72" font-size="14">index 2</text></g><g font-family="system-ui,Arial,sans-serif"><rect x="242" y="138" width="138" height="100" rx="10" fill="#f4ebfa" stroke="#a18dc3" stroke-width="2"/><text x="311" y="179" font-size="29" text-anchor="middle" font-weight="750" fill="#2f6565">71°</text><text x="311" y="216" text-anchor="middle" fill="#536d72" font-size="14">index 3</text></g><g font-family="system-ui,Arial,sans-serif"><rect x="401" y="138" width="138" height="100" rx="10" fill="#f4ebfa" stroke="#a18dc3" stroke-width="2"/><text x="470" y="179" font-size="29" text-anchor="middle" font-weight="750" fill="#2f6565">69°</text><text x="470" y="216" text-anchor="middle" fill="#536d72" font-size="14">index 4</text></g>
<g font-family="system-ui,Arial,sans-serif"><rect x="630" y="139" width="160" height="99" rx="11" fill="#fff0e8" stroke="#d19070" stroke-width="2"/><text x="710" y="177" text-anchor="middle" font-size="29" fill="#ba7150" font-weight="750">72°</text><text x="710" y="216" text-anchor="middle" font-size="14" fill="#8e755b">新温度 index 5</text></g>
<path d="M630 184C589 100,545 101,518 137" stroke="#bd7558" stroke-width="2" fill="none" marker-end="url(#a)"/>
<g font-family="system-ui,Arial,sans-serif"><text x="30" y="283" font-size="15" fill="#7461ba" font-weight="700">弹出 69：等待 5−4=1 天</text><text x="30" y="307" font-size="15" fill="#7461ba" font-weight="700">弹出 71：等待 5−3=2 天</text><text x="30" y="330" font-size="15" fill="#197b76" font-weight="700">保留 75：72 还不够热</text><text x="30" y="363" font-size="13" fill="#657676">栈由底到顶的温度为 75、72，保持单调不增。</text></g></svg>