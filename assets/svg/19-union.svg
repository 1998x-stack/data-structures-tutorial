<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" role="img" aria-labelledby="t d">
<title id="t">并查集：union 只是一次次改写 parent 指针</title>
<desc id="d">parent 数组初始为 [0,1,2,3]，每个元素指向自己。union(0,1) 后 parent[1] 改成 0；union(2,3) 后 parent[3] 改成 2；union(1,2) 先找到 1 的根 0 和 2 的根 2，再把 parent[2] 改成 0。最终 [0,0,0,2]，整棵树以 0 为根。</desc>
<rect width="880" height="430" rx="14" fill="#f9fcf9"/>
<g font-family="system-ui,Arial,sans-serif"><text x="24" y="34" font-size="20" font-weight="750" fill="#234649">并查集：所有操作都落在 parent 数组上</text><text x="24" y="56" font-size="13" fill="#667a7d">parent[i] 记录 i 的父节点；根节点的 parent 指向自己；橙色为本次被改写的格子</text></g>
<g font-family="system-ui,Arial,sans-serif" font-size="14" font-weight="700" fill="#667a7d"><text x="24" y="100">初始：各自为根</text><text x="24" y="180">union(0, 1)</text><text x="24" y="260">union(2, 3)</text><text x="24" y="340">union(1, 2)：两棵树的根 0 与 2 相连</text></g>
<g font-family="system-ui,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle">
<rect x="120" y="110" width="70" height="44" rx="7" fill="#eef0fa" stroke="#7461ba" stroke-width="1.5"/><text x="155" y="139" fill="#4d3f86">0</text>
<rect x="200" y="110" width="70" height="44" rx="7" fill="#eef0fa" stroke="#7461ba" stroke-width="1.5"/><text x="235" y="139" fill="#4d3f86">1</text>
<rect x="280" y="110" width="70" height="44" rx="7" fill="#eef0fa" stroke="#7461ba" stroke-width="1.5"/><text x="315" y="139" fill="#4d3f86">2</text>
<rect x="360" y="110" width="70" height="44" rx="7" fill="#eef0fa" stroke="#7461ba" stroke-width="1.5"/><text x="395" y="139" fill="#4d3f86">3</text>
<rect x="120" y="190" width="70" height="44" rx="7" fill="#eef0fa" stroke="#7461ba" stroke-width="1.5"/><text x="155" y="219" fill="#4d3f86">0</text>
<rect x="200" y="190" width="70" height="44" rx="7" fill="#fdece4" stroke="#b25a3a" stroke-width="2.5"/><text x="235" y="219" fill="#8f3f22">0</text>
<rect x="280" y="190" width="70" height="44" rx="7" fill="#eef0fa" stroke="#7461ba" stroke-width="1.5"/><text x="315" y="219" fill="#4d3f86">2</text>
<rect x="360" y="190" width="70" height="44" rx="7" fill="#eef0fa" stroke="#7461ba" stroke-width="1.5"/><text x="395" y="219" fill="#4d3f86">3</text>
<rect x="120" y="270" width="70" height="44" rx="7" fill="#eef0fa" stroke="#7461ba" stroke-width="1.5"/><text x="155" y="299" fill="#4d3f86">0</text>
<rect x="200" y="270" width="70" height="44" rx="7" fill="#eef0fa" stroke="#7461ba" stroke-width="1.5"/><text x="235" y="299" fill="#4d3f86">0</text>
<rect x="280" y="270" width="70" height="44" rx="7" fill="#eef0fa" stroke="#7461ba" stroke-width="1.5"/><text x="315" y="299" fill="#4d3f86">2</text>
<rect x="360" y="270" width="70" height="44" rx="7" fill="#fdece4" stroke="#b25a3a" stroke-width="2.5"/><text x="395" y="299" fill="#8f3f22">2</text>
<rect x="120" y="350" width="70" height="44" rx="7" fill="#eef0fa" stroke="#7461ba" stroke-width="1.5"/><text x="155" y="379" fill="#4d3f86">0</text>
<rect x="200" y="350" width="70" height="44" rx="7" fill="#eef0fa" stroke="#7461ba" stroke-width="1.5"/><text x="235" y="379" fill="#4d3f86">0</text>
<rect x="280" y="350" width="70" height="44" rx="7" fill="#fdece4" stroke="#b25a3a" stroke-width="2.5"/><text x="315" y="379" fill="#8f3f22">0</text>
<rect x="360" y="350" width="70" height="44" rx="7" fill="#eef0fa" stroke="#7461ba" stroke-width="1.5"/><text x="395" y="379" fill="#4d3f86">2</text></g>
<g font-family="system-ui,Arial,sans-serif" font-size="13" fill="#667a7d"><text x="470" y="139">下标 0 1 2 3</text><text x="470" y="215">1 认 0 做父</text><text x="470" y="295">3 认 2 做父</text><text x="470" y="375">2 认 0 做父，全树以 0 为根</text></g>
<text x="24" y="420" font-size="13" fill="#526f71" font-family="system-ui,Arial,sans-serif">find(x) 就是沿 parent 一路向上直到 self-loop；union 先 find 两个根，再改其中一个的 parent。</text>
</svg>
