<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" role="img" aria-labelledby="t d">
<title id="t">冗余连接：union 发现两端已连通就是环</title>
<desc id="d">三条边依次处理：(1,2) 合并两个集合；(1,3) 使 1、3 连通；(2,3) 时 find(2) 与 find(3) 已经相同，说明这条边会成环，它就是多余的那条。并查集无需重新遍历整张图就能检测环。</desc>
<rect width="880" height="430" rx="14" fill="#f9fcf9"/>
<g font-family="system-ui,Arial,sans-serif"><text x="24" y="34" font-size="20" font-weight="750" fill="#234649">检测环：加边时若两端已连通，这条边就多余</text><text x="24" y="56" font-size="13" fill="#667a7d">按顺序处理边；union 成功说明接通了两个不同集合，union 失败说明它们本就在一起</text></g>
<g stroke="#7d8fb3" stroke-width="2.5" fill="none"><line x1="210" y1="140" x2="350" y2="140"/><line x1="200" y1="170" x2="266" y2="240"/></g>
<line x1="352" y1="166" x2="286" y2="240" stroke="#b25a3a" stroke-width="3" stroke-dasharray="7 5"/>
<g font-family="system-ui,Arial,sans-serif" font-size="20" font-weight="800" text-anchor="middle">
<circle cx="200" cy="125" r="26" fill="#eef0fa" stroke="#7461ba" stroke-width="2"/><text x="200" y="133" fill="#4d3f86">1</text>
<circle cx="360" cy="125" r="26" fill="#eef0fa" stroke="#7461ba" stroke-width="2"/><text x="360" y="133" fill="#4d3f86">2</text>
<circle cx="280" cy="270" r="26" fill="#eef0fa" stroke="#7461ba" stroke-width="2"/><text x="280" y="278" fill="#4d3f86">3</text></g>
<g font-family="system-ui,Arial,sans-serif" font-size="13" fill="#667a7d"><text x="256" y="126">① (1,2)</text><text x="180" y="216">② (1,3)</text><text x="345" y="212" fill="#8f3f22">③ (2,3) 多余</text></g>
<g font-family="system-ui,Arial,sans-serif" font-size="14" fill="#2f6047">
<text x="500" y="130" font-weight="700">union 过程</text>
<text x="500" y="158">① union(1,2) → 成功，count −1</text>
<text x="500" y="184">② union(1,3) → 成功，count −1</text>
<text x="500" y="210" fill="#8f3f22">③ find(2)=find(3)=1 → 失败</text>
<text x="500" y="248" font-weight="700" fill="#8f3f22">返回 [2, 3]</text></g>
<text x="500" y="292" font-size="13" fill="#526f71" font-family="system-ui,Arial,sans-serif">这正是 Kruskal 判断“加这条边会不会成环”的同一动作。</text>
<text x="24" y="392" font-size="13" fill="#526f71" font-family="system-ui,Arial,sans-serif">与 DFS 找环不同，并查集不必每次重扫全图：每加一条边只做两次 find，代价近似 O(1)。</text>
<text x="24" y="416" font-size="13" fill="#526f71" font-family="system-ui,Arial,sans-serif">“多余”指的是在树/森林基础上加边时首次成环的那条；具体返回哪条取决于边的处理顺序。</text>
</svg>
