<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" role="img" aria-labelledby="t d">
<title id="t">快速排序一次分区：枢轴归位</title>
<desc id="d">数组 7,2,1,6,8,5,3,4 以最后一个元素 4 为枢轴，Lomuto 分区扫描一遍后变成 2,1,3,4,8,5,7,6：4 左边的都不大于它，右边的都大于它，枢轴落到最终位置索引 3。左右两段再各自递归。</desc>
<rect width="880" height="420" rx="14" fill="#f9fcf9"/>
<g font-family="system-ui,Arial,sans-serif"><text x="24" y="36" font-size="20" font-weight="750" fill="#234649">快速排序：一次分区只确定一个枢轴</text><text x="24" y="58" font-size="13" fill="#667a7d">扫描时维护“不大于枢轴的前缀”，最后把枢轴换到边界处</text></g>
<g font-family="system-ui,Arial,sans-serif" font-size="13" fill="#667a7d"><text x="24" y="112">初始（枢轴取末位 4）</text><text x="24" y="252">分区后</text></g>
<g font-family="system-ui,Arial,sans-serif" font-size="22" font-weight="800" text-anchor="middle">
<rect x="70" y="130" width="70" height="56" rx="8" fill="#eef0fa" stroke="#7461ba" stroke-width="2"/><text x="105" y="166" fill="#4d3f86">7</text>
<rect x="150" y="130" width="70" height="56" rx="8" fill="#eef0fa" stroke="#7461ba" stroke-width="2"/><text x="185" y="166" fill="#4d3f86">2</text>
<rect x="230" y="130" width="70" height="56" rx="8" fill="#eef0fa" stroke="#7461ba" stroke-width="2"/><text x="265" y="166" fill="#4d3f86">1</text>
<rect x="310" y="130" width="70" height="56" rx="8" fill="#eef0fa" stroke="#7461ba" stroke-width="2"/><text x="345" y="166" fill="#4d3f86">6</text>
<rect x="390" y="130" width="70" height="56" rx="8" fill="#eef0fa" stroke="#7461ba" stroke-width="2"/><text x="425" y="166" fill="#4d3f86">8</text>
<rect x="470" y="130" width="70" height="56" rx="8" fill="#eef0fa" stroke="#7461ba" stroke-width="2"/><text x="505" y="166" fill="#4d3f86">5</text>
<rect x="550" y="130" width="70" height="56" rx="8" fill="#eef0fa" stroke="#7461ba" stroke-width="2"/><text x="585" y="166" fill="#4d3f86">3</text>
<rect x="630" y="130" width="70" height="56" rx="8" fill="#fdece4" stroke="#b25a3a" stroke-width="3"/><text x="665" y="166" fill="#8f3f22">4</text>
<rect x="70" y="270" width="70" height="56" rx="8" fill="#e6f2ea" stroke="#3f7d5a" stroke-width="2"/><text x="105" y="306" fill="#2f6047">2</text>
<rect x="150" y="270" width="70" height="56" rx="8" fill="#e6f2ea" stroke="#3f7d5a" stroke-width="2"/><text x="185" y="306" fill="#2f6047">1</text>
<rect x="230" y="270" width="70" height="56" rx="8" fill="#e6f2ea" stroke="#3f7d5a" stroke-width="2"/><text x="265" y="306" fill="#2f6047">3</text>
<rect x="310" y="270" width="70" height="56" rx="8" fill="#fdece4" stroke="#b25a3a" stroke-width="3"/><text x="345" y="306" fill="#8f3f22">4</text>
<rect x="390" y="270" width="70" height="56" rx="8" fill="#eef0fa" stroke="#7461ba" stroke-width="2"/><text x="425" y="306" fill="#4d3f86">8</text>
<rect x="470" y="270" width="70" height="56" rx="8" fill="#eef0fa" stroke="#7461ba" stroke-width="2"/><text x="505" y="306" fill="#4d3f86">5</text>
<rect x="550" y="270" width="70" height="56" rx="8" fill="#eef0fa" stroke="#7461ba" stroke-width="2"/><text x="585" y="306" fill="#4d3f86">7</text>
<rect x="630" y="270" width="70" height="56" rx="8" fill="#eef0fa" stroke="#7461ba" stroke-width="2"/><text x="665" y="306" fill="#4d3f86">6</text>
</g>
<g font-family="system-ui,Arial,sans-serif" font-size="13" fill="#3f7d5a" text-anchor="middle"><text x="185" y="352">≤ 4</text></g>
<g font-family="system-ui,Arial,sans-serif" font-size="13" fill="#7461ba" text-anchor="middle"><text x="535" y="352">＞ 4</text></g>
<text x="24" y="392" font-size="13" fill="#526f71" font-family="system-ui,Arial,sans-serif">枢轴 4 已到最终索引 3；左段 [2,1,3] 与右段 [8,5,7,6] 分别递归，两边互不影响。</text>
</svg>
