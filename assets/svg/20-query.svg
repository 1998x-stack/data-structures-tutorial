<rect x="395" y="33" width="90" height="34" rx="6" fill="#f1f5f9" stroke="#94a3b8"/><text x="440" y="55" fill="#475569">sum[0..7]</text>
<rect x="175" y="113" width="90" height="34" rx="6" fill="#f1f5f9" stroke="#94a3b8"/><text x="220" y="135" fill="#475569">sum[0..3]</text>
<rect x="615" y="113" width="90" height="34" rx="6" fill="#f1f5f9" stroke="#94a3b8"/><text x="660" y="135" fill="#475569">sum[4..7]</text>
<rect x="65" y="193" width="90" height="34" rx="6" fill="#f1f5f9" stroke="#94a3b8"/><text x="110" y="215" fill="#475569">sum[0..1]</text>
<rect x="285" y="193" width="90" height="34" rx="6" fill="#dcfce7" stroke="#15803d"/><text x="330" y="215" fill="#14532d">sum[2..3]</text>
<rect x="505" y="193" width="90" height="34" rx="6" fill="#dcfce7" stroke="#15803d"/><text x="550" y="215" fill="#14532d">sum[4..5]</text>
<rect x="725" y="193" width="90" height="34" rx="6" fill="#f1f5f9" stroke="#94a3b8"/><text x="770" y="215" fill="#475569">sum[6..7]</text>
<rect x="35" y="275" width="40" height="30" rx="5" fill="#f8fafc" stroke="#cbd5e1"/><text x="55" y="295" fill="#94a3b8">a0</text>
<rect x="145" y="275" width="40" height="30" rx="5" fill="#f8fafc" stroke="#cbd5e1"/><text x="165" y="295" fill="#94a3b8">a1</text>
