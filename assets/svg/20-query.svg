<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" role="img" aria-labelledby="q-title q-desc">
<title id="q-title">区间查询 [2,5] 被拆成少数几个已覆盖节点</title>
<desc id="q-desc">查询下标 2 到 5 的和时，节点 sum[2..3] 与 sum[4..5] 恰好被完全覆盖，可以直接取值相加，无需访问每个叶子。</desc>
<g font-family="-apple-system, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">
<line x1="440" y1="67" x2="220" y2="113" stroke="#64748b"/><line x1="440" y1="67" x2="660" y2="113" stroke="#64748b"/>
