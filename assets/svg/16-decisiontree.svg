<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" role="img" aria-labelledby="t d">
<title id="t">子集问题的决策树：对解空间做深度优先遍历</title>
<desc id="d">从空集出发，每次决定是否加入下一个元素，就长出一棵决策树。按先序深度优先访问，路径 [1,2,3]、[1,3]、[2,3]、[3] 等都是合法子集；每个节点都对应一个解，所以遍历顺序决定了输出的子集顺序。</desc>
<rect width="880" height="430" rx="14" fill="#f9fcf9"/>
<g font-family="system-ui,Arial,sans-serif"><text x="24" y="34" font-size="20" font-weight="750" fill="#234649">回溯 = 对决策树做深度优先遍历</text><text x="24" y="56" font-size="13" fill="#667a7d">每个节点是一个“当前已选集合”，每条边是一次选择；走到底再回退去试别的分支</text></g>
<g stroke="#7d8fb3" stroke-width="2" fill="none">
<line x1="440" y1="92" x2="230" y2="138"/><line x1="440" y1="92" x2="520" y2="138"/><line x1="440" y1="92" x2="760" y2="138"/>
<line x1="230" y1="182" x2="120" y2="228"/><line x1="230" y1="182" x2="340" y2="228"/>
<line x1="520" y1="182" x2="620" y2="228"/><line x1="120" y1="272" x2="120" y2="318"/></g>
<g font-family="system-ui,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#4d3f86">
<rect x="395" y="50" width="90" height="42" rx="8" fill="#fdece4" stroke="#b25a3a" stroke-width="2.5"/><text x="440" y="78">[]</text>
<rect x="185" y="138" width="90" height="42" rx="8" fill="#eef0fa" stroke="#7461ba" stroke-width="1.5"/><text x="230" y="166">[1]</text>
<rect x="475" y="138" width="90" height="42" rx="8" fill="#eef0fa" stroke="#7461ba" stroke-width="1.5"/><text x="520" y="166">[2]</text>
<rect x="715" y="138" width="90" height="42" rx="8" fill="#eef0fa" stroke="#7461ba" stroke-width="1.5"/><text x="760" y="166">[3]</text>
<rect x="75" y="228" width="90" height="42" rx="8" fill="#eef0fa" stroke="#7461ba" stroke-width="1.5"/><text x="120" y="256">[1,2]</text>
<rect x="295" y="228" width="90" height="42" rx="8" fill="#eef0fa" stroke="#7461ba" stroke-width="1.5"/><text x="340" y="256">[1,3]</text>
<rect x="575" y="228" width="90" height="42" rx="8" fill="#eef0fa" stroke="#7461ba" stroke-width="1.5"/><text x="620" y="256">[2,3]</text>
<rect x="75" y="318" width="90" height="42" rx="8" fill="#e6f2ea" stroke="#3f7d5a" stroke-width="1.5"/><text x="120" y="346">[1,2,3]</text></g>
<g font-family="system-ui,Arial,sans-serif" font-size="12" fill="#8f3f22" text-anchor="middle"><text x="300" y="112">+1</text><text x="500" y="112">+2</text><text x="640" y="112">+3</text><text x="150" y="202">+2</text><text x="315" y="202">+3</text><text x="590" y="202">+3</text></g>
<text x="24" y="392" font-size="13" fill="#526f71" font-family="system-ui,Arial,sans-serif">先序访问顺序：[] → [1] → [1,2] → [1,2,3] → 回退 → [1,3] → 回退到 [1] → 回退到 [] → [2] → [2,3] → … → [3]</text>
<text x="24" y="416" font-size="13" fill="#b25a3a" font-family="system-ui,Arial,sans-serif">“回退”那一步就是“撤销选择”：把刚加入的元素从路径里弹掉，回到上一个决策点。</text>
</svg>
