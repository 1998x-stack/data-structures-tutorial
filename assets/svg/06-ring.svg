<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" role="img" aria-labelledby="t d"><title id="t">环形缓冲回绕示意</title><desc id="d">容量4的数组中出队 A 后重用索引0，按顺序加入 D 和 E 并让 rear 循环回到索引1</desc><rect width="880" height="390" rx="14" fill="#f9fcf9"/>
<defs><marker id="a" viewBox="0 0 10 10" markerWidth="7" markerHeight="7" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#3c8c84"/></marker></defs>
<g font-family="system-ui,Arial,sans-serif"><text x="24" y="39" font-size="20" font-weight="750" fill="#254447">固定容量 = 4；队尾写入后取模回绕</text><text x="24" y="62" font-size="13" fill="#607777">队列 FIFO 顺序与环形数组的物理左右位置不是同一个概念</text></g>
<g font-family="system-ui,Arial,sans-serif"><text x="28" y="105" font-size="16" font-weight="750" fill="#675a91">状态 A：弹出 A 后</text><text x="28" y="130" font-size="13" fill="#657877">front=1，rear=3，size=2</text>
<rect x="352" y="69" width="107" height="78" rx="8" fill="#fff" stroke="#b7cdc4" stroke-width="1.8"/><text x="405" y="115" text-anchor="middle" font-size="22" font-weight="750" fill="#a2b7b0">空</text><text x="405" y="135" text-anchor="middle" font-size="12" fill="#6b8780">index 0</text><rect x="471" y="69" width="107" height="78" rx="8" fill="#e4f3ee" stroke="#68a49c" stroke-width="1.8"/><text x="524" y="115" text-anchor="middle" font-size="22" font-weight="750" fill="#226964">B</text><text x="524" y="135" text-anchor="middle" font-size="12" fill="#6b8780">index 1</text><rect x="590" y="69" width="107" height="78" rx="8" fill="#e4f3ee" stroke="#68a49c" stroke-width="1.8"/><text x="643" y="115" text-anchor="middle" font-size="22" font-weight="750" fill="#226964">C</text><text x="643" y="135" text-anchor="middle" font-size="12" fill="#6b8780">index 2</text><rect x="709" y="69" width="107" height="78" rx="8" fill="#fff" stroke="#b7cdc4" stroke-width="1.8"/><text x="762" y="115" text-anchor="middle" font-size="22" font-weight="750" fill="#a2b7b0">空</text><text x="762" y="135" text-anchor="middle" font-size="12" fill="#6b8780">index 3</text></g><g font-family="system-ui,Arial,sans-serif"><text x="28" y="247" font-size="16" font-weight="750" fill="#256e6c">状态 B：加入 D、E 后</text><text x="28" y="272" font-size="13" fill="#657877">front=1，rear=1，size=4</text>
<rect x="352" y="211" width="107" height="78" rx="8" fill="#e4f3ee" stroke="#68a49c" stroke-width="1.8"/><text x="405" y="257" text-anchor="middle" font-size="22" font-weight="750" fill="#226964">E</text><text x="405" y="277" text-anchor="middle" font-size="12" fill="#6b8780">index 0</text><rect x="471" y="211" width="107" height="78" rx="8" fill="#e4f3ee" stroke="#68a49c" stroke-width="1.8"/><text x="524" y="257" text-anchor="middle" font-size="22" font-weight="750" fill="#226964">B</text><text x="524" y="277" text-anchor="middle" font-size="12" fill="#6b8780">index 1</text><rect x="590" y="211" width="107" height="78" rx="8" fill="#e4f3ee" stroke="#68a49c" stroke-width="1.8"/><text x="643" y="257" text-anchor="middle" font-size="22" font-weight="750" fill="#226964">C</text><text x="643" y="277" text-anchor="middle" font-size="12" fill="#6b8780">index 2</text><rect x="709" y="211" width="107" height="78" rx="8" fill="#e4f3ee" stroke="#68a49c" stroke-width="1.8"/><text x="762" y="257" text-anchor="middle" font-size="22" font-weight="750" fill="#226964">D</text><text x="762" y="277" text-anchor="middle" font-size="12" fill="#6b8780">index 3</text></g>
<path d="M768 147C858 160,858 226,353 245" stroke="#3c8c84" stroke-width="2.5" fill="none" marker-end="url(#a)"/><text x="780" y="185" font-family="system-ui,Arial,sans-serif" font-size="13" fill="#278078" text-anchor="middle">rear 回绕</text><text x="30" y="375" font-family="system-ui,Arial,sans-serif" font-size="13" fill="#617877">最右侧不是逻辑尾端：真正的尾端由 rear 和 size 的状态共同确定。</text></svg>