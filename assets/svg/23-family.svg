<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" role="img" aria-labelledby="rf-title rf-desc">
<title id="rf-title">反转链表题型家族：一个核心不变量派生出多种变形</title>
<desc id="rf-desc">核心题 206 反转链表用三指针或递归逐段反转指针。92 反转指定区间、25 每 K 个一组反转、24 两两交换都是“限定反转范围”；143 重排与 234 回文则把“快慢指针找中点 + 反转后半 + 合并或比较”组合起来。</desc>
<defs>
<marker id="rf-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#475569"/></marker>
</defs>
<g font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">
<rect x="300" y="34" width="280" height="54" rx="8" fill="#fde68a" stroke="#b45309"/>
<text x="440" y="58" fill="#78350f">核心：206 反转链表</text><text x="440" y="78" fill="#78350f">三指针 / 递归逐段反转</text>
<rect x="8" y="150" width="164" height="60" rx="8" fill="#e0e7ff" stroke="#4338ca"/><text x="90" y="176" fill="#312e81">92 反转区间 II</text><text x="90" y="196" fill="#312e81">先定位 left 前驱</text>
<rect x="180" y="150" width="164" height="60" rx="8" fill="#e0e7ff" stroke="#4338ca"/><text x="262" y="176" fill="#312e81">25 每 K 个一组</text><text x="262" y="196" fill="#312e81">够 K 个才反转</text>
<rect x="352" y="150" width="164" height="60" rx="8" fill="#e0e7ff" stroke="#4338ca"/><text x="434" y="176" fill="#312e81">24 两两交换</text><text x="434" y="196" fill="#312e81">K=2 的特例</text>
<rect x="524" y="150" width="164" height="60" rx="8" fill="#dcfce7" stroke="#15803d"/><text x="606" y="176" fill="#14532d">143 重排链表</text><text x="606" y="196" fill="#14532d">中点+反转后半+合并</text>
<rect x="696" y="150" width="176" height="60" rx="8" fill="#dcfce7" stroke="#15803d"/><text x="784" y="176" fill="#14532d">234 回文链表</text><text x="784" y="196" fill="#14532d">中点+反转后半+比较</text>
<line x1="360" y1="88" x2="92" y2="148" stroke="#475569" marker-end="url(#rf-arrow)"/>
<line x1="400" y1="88" x2="264" y2="148" stroke="#475569" marker-end="url(#rf-arrow)"/>
<line x1="440" y1="88" x2="436" y2="148" stroke="#475569" marker-end="url(#rf-arrow)"/>
<line x1="480" y1="88" x2="604" y2="148" stroke="#475569" marker-end="url(#rf-arrow)"/>
<line x1="520" y1="88" x2="782" y2="148" stroke="#475569" marker-end="url(#rf-arrow)"/>
<text x="440" y="252" fill="#1e293b">三条“限定范围反转”：区别只在反转哪一段、反转前要不要定位边界</text>
<text x="440" y="288" fill="#475569">两条“组合变形”：先找中点，再反转后半，最后合并或比较</text>
<text x="440" y="312" fill="#475569">吃透 206 的写法，等于同时拿到这 5 道变形的共同骨架</text>
</g></svg>
