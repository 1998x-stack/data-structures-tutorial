<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" role="img" aria-labelledby="t d"><title id="t">BFS 的发现层次与最短边数</title><desc id="d">从根节点 A 开始，先访问 B C，然后访问 D E F，层数依次为0 1 2</desc><rect width="880" height="390" rx="14" fill="#f9fcf9"/>
<defs><marker id="arr" viewBox="0 0 10 10" markerWidth="7" markerHeight="7" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#729c92"/></marker></defs><g font-family="system-ui,Arial,sans-serif"><text x="26" y="40" font-size="20" fill="#22474a" font-weight="750">队列保证先完成第 1 层，才处理第 2 层</text><text x="26" y="63" font-size="13" fill="#687d78">示例的边都视为一单位长度；层数等于最少边数</text></g>
<g stroke="#729c92" stroke-width="2.8" fill="none"><path d="M440 112L307 188M440 112L582 188M307 206L206 284M582 206L511 284M582 206L707 284"/></g>
<g font-family="system-ui,Arial,sans-serif"><circle cx="440" cy="110" r="26" fill="#e6eff5" stroke="#a295c3" stroke-width="2.4"/><text x="440" y="117" text-anchor="middle" font-size="23" font-weight="750" fill="#315f63">A</text></g><g font-family="system-ui,Arial,sans-serif"><circle cx="307" cy="198" r="26" fill="#dff2ec" stroke="#5aa79b" stroke-width="2.4"/><text x="307" y="205" text-anchor="middle" font-size="23" font-weight="750" fill="#315f63">B</text></g><g font-family="system-ui,Arial,sans-serif"><circle cx="582" cy="198" r="26" fill="#dff2ec" stroke="#5aa79b" stroke-width="2.4"/><text x="582" y="205" text-anchor="middle" font-size="23" font-weight="750" fill="#315f63">C</text></g><g font-family="system-ui,Arial,sans-serif"><circle cx="206" cy="295" r="26" fill="#f0eafa" stroke="#a295c3" stroke-width="2.4"/><text x="206" y="302" text-anchor="middle" font-size="23" font-weight="750" fill="#315f63">D</text></g><g font-family="system-ui,Arial,sans-serif"><circle cx="511" cy="295" r="26" fill="#f0eafa" stroke="#a295c3" stroke-width="2.4"/><text x="511" y="302" text-anchor="middle" font-size="23" font-weight="750" fill="#315f63">E</text></g><g font-family="system-ui,Arial,sans-serif"><circle cx="707" cy="295" r="26" fill="#f0eafa" stroke="#a295c3" stroke-width="2.4"/><text x="707" y="302" text-anchor="middle" font-size="23" font-weight="750" fill="#315f63">F</text></g>
<g font-family="system-ui,Arial,sans-serif" font-size="14"><text x="32" y="116" fill="#677b7d">距离 0</text><text x="32" y="205" fill="#677b7d">距离 1</text><text x="32" y="302" fill="#677b7d">距离 2</text><text x="28" y="371" font-size="14" font-weight="700" fill="#266b66">出队顺序：A → B → C → D → E → F</text></g></svg>