<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" role="img" aria-labelledby="t d">
<title id="t">路径压缩：find 时把路径上的节点直接挂到根</title>
<desc id="d">压缩前 3→2→1→0 是一条长链，find(3) 要向上走三步。压缩后 1、2、3 都直接指向根 0，树变成两层，之后任何查询都只需一步。压缩只在 find 时顺便完成，不额外增加复杂度。</desc>
<rect width="880" height="430" rx="14" fill="#f9fcf9"/>
<g font-family="system-ui,Arial,sans-serif"><text x="24" y="34" font-size="20" font-weight="750" fill="#234649">路径压缩：查询一次，顺路把链拍平</text><text x="24" y="56" font-size="13" fill="#667a7d">find 从 x 走到根的过程中，把经过的每个节点都改成直接指向根</text></g>
<defs><marker id="a19c" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#7d8fb3"/></marker></defs>
<g font-family="system-ui,Arial,sans-serif" font-size="14" font-weight="700" fill="#8f3f22"><text x="90" y="92">压缩前：链长 3</text></g>
<g font-family="system-ui,Arial,sans-serif" font-size="18" font-weight="800" text-anchor="middle">
<circle cx="140" cy="130" r="22" fill="#fdece4" stroke="#b25a3a" stroke-width="2.5"/><text x="140" y="137" fill="#8f3f22">0</text>
<circle cx="140" cy="210" r="22" fill="#eef0fa" stroke="#7461ba" stroke-width="1.5"/><text x="140" y="217" fill="#4d3f86">1</text>
<circle cx="140" cy="290" r="22" fill="#eef0fa" stroke="#7461ba" stroke-width="1.5"/><text x="140" y="297" fill="#4d3f86">2</text>
<circle cx="140" cy="370" r="22" fill="#eef0fa" stroke="#7461ba" stroke-width="1.5"/><text x="140" y="377" fill="#4d3f86">3</text></g>
<g stroke="#7d8fb3" stroke-width="2" fill="none" marker-end="url(#a19c)"><line x1="140" y1="188" x2="140" y2="154"/><line x1="140" y1="268" x2="140" y2="234"/><line x1="140" y1="348" x2="140" y2="314"/></g>
<text x="180" y="374" font-size="13" fill="#667a7d" font-family="system-ui,Arial,sans-serif">find(3) 要走 3 → 2 → 1 → 0</text>
<g font-family="system-ui,Arial,sans-serif" font-size="14" font-weight="700" fill="#2f6047"><text x="520" y="92">find(3) 之后：所有节点直达根</text></g>
<g font-family="system-ui,Arial,sans-serif" font-size="18" font-weight="800" text-anchor="middle">
<circle cx="610" cy="150" r="22" fill="#fdece4" stroke="#b25a3a" stroke-width="2.5"/><text x="610" y="157" fill="#8f3f22">0</text>
<circle cx="490" cy="260" r="22" fill="#e6f2ea" stroke="#3f7d5a" stroke-width="1.5"/><text x="490" y="267" fill="#2f6047">1</text>
<circle cx="610" cy="260" r="22" fill="#e6f2ea" stroke="#3f7d5a" stroke-width="1.5"/><text x="610" y="267" fill="#2f6047">2</text>
<circle cx="730" cy="260" r="22" fill="#e6f2ea" stroke="#3f7d5a" stroke-width="1.5"/><text x="730" y="267" fill="#2f6047">3</text></g>
<g stroke="#3f7d5a" stroke-width="2" fill="none" marker-end="url(#a19c)"><line x1="500" y1="242" x2="592" y2="170"/><line x1="610" y1="236" x2="610" y2="176"/><line x1="720" y1="242" x2="628" y2="170"/></g>
<text x="490" y="330" font-size="13" fill="#2f6047" font-family="system-ui,Arial,sans-serif">之后 find(1/2/3) 都只走一步</text>
<text x="24" y="404" font-size="13" fill="#526f71" font-family="system-ui,Arial,sans-serif">递归写法简洁但有栈溢出风险；迭代版同一趟完成，生产环境更稳妥。</text>
<text x="24" y="426" font-size="13" fill="#526f71" font-family="system-ui,Arial,sans-serif">路径压缩不改变“谁能到达谁”的等价关系，只是让查询更快。</text>
</svg>
