<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" role="img" aria-labelledby="t d">
<title id="t">Huffman 树：频率越小合并得越晚，编码越长</title>
<desc id="d">对频率 5,9,12,13,16,45 用最小堆每次合并两个最小节点，得到一棵二叉树。左枝记 0、右枝记 1，则频率最高的 f 编码最短（1 位），最少的 a、b 编码最长（4 位）。带权路径长度 45×1+12×3+13×3+16×3+5×4+9×4 = 224，远小于定长 8 位的 800。</desc>
<rect width="880" height="430" rx="14" fill="#f9fcf9"/>
<g font-family="system-ui,Arial,sans-serif"><text x="24" y="34" font-size="20" font-weight="750" fill="#234649">Huffman 编码：最小堆每次合并两个最轻的节点</text><text x="24" y="56" font-size="13" fill="#667a7d">节点内为权重；叶子标出字符与频率；左枝 0、右枝 1，越深的叶子编码越长</text></g>
<g stroke="#7d8fb3" stroke-width="1.8" fill="none">
<line x1="410" y1="90" x2="210" y2="130"/><line x1="470" y1="90" x2="530" y2="130"/>
<line x1="540" y1="170" x2="400" y2="200"/><line x1="600" y1="170" x2="680" y2="200"/>
<line x1="360" y1="240" x2="320" y2="270"/><line x1="400" y1="240" x2="440" y2="270"/>
<line x1="680" y1="240" x2="640" y2="270"/><line x1="720" y1="240" x2="790" y2="270"/>
<line x1="600" y1="310" x2="570" y2="340"/><line x1="640" y1="310" x2="680" y2="340"/></g>
<g font-family="system-ui,Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#4d3f86">
<rect x="400" y="60" width="80" height="34" rx="7" fill="#fdece4" stroke="#b25a3a" stroke-width="2.5"/><text x="440" y="83" fill="#8f3f22">100</text>
<rect x="170" y="130" width="80" height="34" rx="7" fill="#e6f2ea" stroke="#3f7d5a" stroke-width="1.5"/><text x="210" y="153" fill="#2f6047">f:45</text>
<rect x="520" y="130" width="80" height="34" rx="7" fill="#eef0fa" stroke="#7461ba" stroke-width="1.5"/><text x="560" y="153">55</text>
<rect x="360" y="200" width="80" height="34" rx="7" fill="#eef0fa" stroke="#7461ba" stroke-width="1.5"/><text x="400" y="223">25</text>
<rect x="640" y="200" width="80" height="34" rx="7" fill="#eef0fa" stroke="#7461ba" stroke-width="1.5"/><text x="680" y="223">30</text>
<rect x="280" y="270" width="80" height="34" rx="7" fill="#e6f2ea" stroke="#3f7d5a" stroke-width="1.5"/><text x="320" y="293" fill="#2f6047">c:12</text>
<rect x="400" y="270" width="80" height="34" rx="7" fill="#e6f2ea" stroke="#3f7d5a" stroke-width="1.5"/><text x="440" y="293" fill="#2f6047">d:13</text>
<rect x="560" y="270" width="80" height="34" rx="7" fill="#eef0fa" stroke="#7461ba" stroke-width="1.5"/><text x="600" y="293">14</text>
<rect x="750" y="270" width="80" height="34" rx="7" fill="#e6f2ea" stroke="#3f7d5a" stroke-width="1.5"/><text x="790" y="293" fill="#2f6047">e:16</text>
<rect x="530" y="340" width="80" height="34" rx="7" fill="#e6f2ea" stroke="#3f7d5a" stroke-width="1.5"/><text x="570" y="363" fill="#2f6047">a:5</text>
<rect x="640" y="340" width="80" height="34" rx="7" fill="#e6f2ea" stroke="#3f7d5a" stroke-width="1.5"/><text x="680" y="363" fill="#2f6047">b:9</text></g>
<g font-family="system-ui,Arial,sans-serif" font-size="11" fill="#b25a3a"><text x="296" y="106">0</text><text x="516" y="106">1</text><text x="452" y="182">0</text><text x="628" y="182">1</text><text x="326" y="252">0</text><text x="426" y="252">1</text></g>
<text x="24" y="404" font-size="13" fill="#526f71" font-family="system-ui,Arial,sans-serif">带权路径长度 WPL = 45×1 + 12×3 + 13×3 + 16×3 + 5×4 + 9×4 = 224 位；定长 8 位共 800 位，压缩到约 28%。</text>
<text x="24" y="426" font-size="13" fill="#526f71" font-family="system-ui,Arial,sans-serif">因为是前缀编码（没有编码是另一个的前缀），解码时不产生歧义。</text>
</svg>
